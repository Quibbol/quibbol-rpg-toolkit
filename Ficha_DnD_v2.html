<script id="theme-bootstrap">
(()=>{
  const root=document.documentElement;
  root.classList.add('theme-booting');
  const parse=raw=>{
    if(!raw)return null;
    try{const value=JSON.parse(raw);if(value&&(value.theme==='dark'||value.theme==='light'))return {theme:value.theme,updatedAt:Number(value.updatedAt)||0};}
    catch(error){if(raw==='dark'||raw==='light')return {theme:raw,updatedAt:0};}
    return null;
  };
  let fallback='dark';
  try{const legacy=JSON.parse(localStorage.getItem('dnd2024CharacterManagerV1'));if(legacy?.theme==='light'||legacy?.theme==='dark')fallback=legacy.theme;}catch(error){}
  let stored=null;
  try{stored=parse(localStorage.getItem('appsRolTheme'));}catch(error){}
  const fromWindow=String(window.name||'').startsWith('appsRolTheme:')?parse(String(window.name).slice(13)):null;
  const newest=[stored,fromWindow].filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  const urlTheme=new URLSearchParams(location.search).get('theme');
  root.dataset.theme=urlTheme==='light'||urlTheme==='dark'?urlTheme:(newest?.theme||fallback);
})();
</script>

const SHARED_THEME_KEY='appsRolTheme';
const THEME_WINDOW_PREFIX='appsRolTheme:';
function parseThemePreference(raw){
  if(!raw)return null;
  try{
    const value=JSON.parse(raw);
    if(value&&(value.theme==='dark'||value.theme==='light'))return {theme:value.theme,updatedAt:Number(value.updatedAt)||0};
  }catch(error){
    if(raw==='dark'||raw==='light')return {theme:raw,updatedAt:0};
  }
  return null;
}
function readThemePreference(fallback='dark'){
  const urlTheme=new URLSearchParams(location.search).get('theme');
  if(urlTheme==='dark'||urlTheme==='light'){
    try{const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete('theme');history.replaceState(null,'',cleanUrl.href);}catch(error){}
    return urlTheme;
  }
  let stored=null;
  try{stored=parseThemePreference(localStorage.getItem(SHARED_THEME_KEY));}catch(error){}
  const fromWindow=String(window.name||'').startsWith(THEME_WINDOW_PREFIX)
    ?parseThemePreference(String(window.name).slice(THEME_WINDOW_PREFIX.length))
    :null;
  const newest=[stored,fromWindow].filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  return newest?.theme||(fallback==='light'?'light':'dark');
}
function writeThemePreference(theme){
  const preference={theme:theme==='light'?'light':'dark',updatedAt:Date.now()};
  const serialized=JSON.stringify(preference);
  try{localStorage.setItem(SHARED_THEME_KEY,serialized);}catch(error){}
  try{window.name=THEME_WINDOW_PREFIX+serialized;}catch(error){}
  return preference.theme;
}

function normalizeCharacter(source,index=0){

function normalizeStoredState(source){

function mod(score){return Math.floor((Number(score)-10)/2)}function signed(n){return Number(n)>=0?'+'+Number(n):String(Number(n))}function prof(){return ch().proficiencyOverride!==''?Number(ch().proficiencyOverride):Math.ceil(Number(ch().level)/4)+1}function skillAbility(name){return Object.keys(ABILITIES).find(k=>ABILITIES[k][1].includes(name))}function skillBonus(name){const c=ch(),a=skillAbility(name),r=Number(c.skills[name]?.rank||0);return mod(c.abilities[a].score)+prof()*r}function saveBonus(k){return mod(ch().abilities[k].score)+(ch().abilities[k].save?prof():0)}function initiative(){return ch().initiativeOverride!==''?Number(ch().initiativeOverride):mod(ch().abilities.dex.score)}function shieldBonus(){const c=ch();return c.shieldEquipped?2+Math.max(0,Number(c.shield)||0):0}function totalArmorClass(){return (Number(ch().armorClass)||0)+shieldBonus()}function setTotalArmorClass(value){let n=Number(value);if(!Number.isFinite(n))n=0;ch().armorClass=Math.max(0,n-shieldBonus());autoSave();render()}function changeShieldBonus(delta){const c=ch(),current=Math.max(0,Number(c.shield)||0);c.shield=Math.max(0,current+delta);autoSave();render()}function passive(){return ch().passiveOverride!==''?Number(ch().passiveOverride):10+skillBonus('Percepción')}function spellMod(){return mod(ch().abilities[ch().spellcasting.ability].score)}function spellDC(){return 8+prof()+spellMod()}function spellAttack(){return prof()+spellMod()}

'long'].includes(key))return;const wasActive=!!r[key];r.short=false;r.long=false;if(!wasActive)r[key]=true;autoSave();render()}function setCurrentHP(value){const c=ch(),n=Number(value);c.hp.current=Math.max(-c.hp.max,Math.min(c.hp.max,Number.isFinite(n)?n:0));autoSave();render()}function setMaxHP(value){const c=ch(),n=Number(value);c.hp.max=Math.max(1,Math.min(999,Number.isFinite(n)?n:1));c.hp.current=Math.max(-c.hp.max,Math.min(c.hp.max,c.hp.current));c.hp.temp=Math.max(0,c.hp.temp);autoSave();render()}function setTempHP(value){const c=ch(),n=Number(value);c.hp.temp=Math.max(0,Number.isFinite(n)?n:0);autoSave();render()}function adjustHP(direction){const input=document.getElementById('hpAdjustment'),raw=Number(input?.value),amount=Math.max(0,Number.isFinite(raw)?raw:0),c=ch();if(direction<0){const absorbed=Math.min(c.hp.temp,amount);c.hp.temp=Math.max(0,c.hp.temp-absorbed);const remaining=amount-absorbed;if(remaining>0)c.hp.current=Math.max(-c.hp.max,c.hp.current-remaining)}else if(direction>0){c.hp.current=Math.min(c.hp.max,c.hp.current+amount)}autoSave();render()}function restoreHP(){const c=ch();c.hp.current=c.hp.max;c.hp.temp=0;autoSave();render()}function setCurrentHitDice(value){const c=ch(),n=Number(value);c.hitDice.current=Math.max(1,Math.min(c.hitDice.max,Number.isFinite(n)?n:1));autoSave();render()}function setMaxHitDice(value){const c=ch(),n=Number(value);c.hitDice.max=Math.max(1,Math.min(20,Number.isFinite(n)?n:1));c.hitDice.current=Math.max(1,Math.min(c.hitDice.max,c.hitDice.current));autoSave();render()}function setDeathSave(type,value){const c=ch(),current=Number(c.death[type])||0;c.death[type]=current===value?value-1:value;autoSave();render()}function updateList(list,i,key,value,rerender=false){ch()[list][i][key]=value;autoSave();if(rerender)render()}function removeList(list,i){ch()[list].splice(i,1);autoSave();render()}function moveListItem(list,i,direction){const items=ch()[list],target=i+direction;if(!Array.isArray(items)||target<0||target>=items.length)return;[items[i],items[target]]=[items[target],items[i]];autoSave();render()}function toggleWeaponPicker(){weaponPickerOpen=!weaponPickerOpen;render()}function weaponIsProficient(name,data,c=ch()){return weaponCategoryList(c).includes(data.category)||weaponTrainingList(c).includes(name)}function weaponAbilityMod(data,c=ch()){const str=mod(c.abilities.str.score),dex=mod(c.abilities.dex.score);if(data.finesse)return Math.max(str,dex);return data.kind==='ranged'?dex:str}function weaponAttackValue(name,data,c=ch()){return signed(weaponAbilityMod(data,c)+(weaponIsProficient(name,data,c)?prof():0))}function weaponDamageValue(data,c=ch()){const bonus=weaponAbilityMod(data,c),suffix=bonus===0?'':bonus>0?` + ${bonus}`:` - ${Math.abs(bonus)}`;return `${data.damage}${suffix} ${data.type}`}function weaponNotesValue(data){const parts=[];if(data.properties&&data.properties.length)parts.push(data.properties.join(', '));if(data.mastery)parts.push(`Maestría: ${data.mastery}`);return parts.join(' · ')}function syncAutoWeapons(c=ch()){if(!Array.isArray(c.weapons))c.weapons=[];c.weapons.forEach(w=>{if(!w||w.source!=='weapon2024'||!w.weaponId||!WEAPON_DATA_2024[w.weaponId])return;const data=WEAPON_DATA_2024[w.weaponId];w.name=w.weaponId;w.attack=weaponAttackValue(w.weaponId,data,c);w.damage=weaponDamageValue(data,c);w.range=data.range;w.notes=weaponNotesValue(data)})}function addWeaponFromCatalog(name){const data=WEAPON_DATA_2024[name];if(!data)return;ch().weapons.push({source:'weapon2024',weaponId:name,name,attack:weaponAttackValue(name,data),damage:weaponDamageValue(data),range:data.range,notes:weaponNotesValue(data)});weaponPickerOpen=false;autoSave();render()}function updateWeaponField(i,key,value){const w=ch().weapons[i];if(!w)return;w[key]=value;if(w.source==='weapon2024')w.source='manual';autoSave()}function moveWeapon(i,direction){const list=ch().weapons,target=i+direction;if(target<0||target>=list.length)return;[list[i],list[target]]=[list[target],list[i]];autoSave();re let combatOverlayShouldClose=false;

function initCombatOverlay(){
  const overlay=document.getElementById('combatModal');
  const panel=overlay?.querySelector('.combat-side-panel');

  if(!overlay||!panel||overlay.dataset.outsideCloseReady==='true')return;

  overlay.dataset.outsideCloseReady='true';

  overlay.addEventListener('pointerdown',event=>{
    combatOverlayShouldClose=!panel.contains(event.target);
  });

  overlay.addEventListener('pointercancel',()=>{
    combatOverlayShouldClose=false;
  });

  overlay.addEventListener('click',event=>{
    if(combatOverlayShouldClose&&event.target===overlay){
      closeCombatManager();
    }
    combatOverlayShouldClose=false;
  });
}

function toggleCombatManager(){
  const overlay=document.getElementById('combatModal');
  overlay.classList.contains('open')?closeCombatManager():openCombatManager();
}
function closeCombatManager(){
  const overlay=document.getElementById('combatModal');
  const button=document.getElementById('combatFab');
  overlay.classList.remove('open');
  document.body.classList.remove('combat-panel-open');
  button.textContent='♥';
  button.title='Abrir gestor de combate';
  button.setAttribute('aria-label','Abrir gestor de combate');
  button.setAttribute('aria-expanded','false');
}
function adjustHPFromModal(direction){adjustHP(direction);openCombatManager()}function restoreHPFromModal(){restoreHP();openCombatManager()}
function openRest(type){restType=type;document.getElementById('restTitle').textContent=type==='short'?'Descanso corto':'Descanso largo';const c=ch(),eligible=c.resources.map((r,i)=>({r,i})).filter(x=>type==='short'?x.r.short:(x.r.long||x.r.short));document.getElementById('restOptions').innerHTML=`<label><input class="check" id="restDeath" type="checkbox" ${type==='long'?'checked':''}> Reiniciar salvaciones contra muerte</label>${type==='long'?'<label><input class="check" id="restHp" type="checkbox" checked> Recuperar todos los puntos de golpe</label><label><input class="check" id="restHit" type="checkbox" checked> Recuperar la mitad de los dados de golpe máximos</label>':'<label><input class="check" id="restHp" type="checkbox"> Ajustar manualmente los PG después del descanso</label>'}<label><input class="check" id="restSlots" type="checkbox" ${type==='long'?'checked':''}> Recuperar espacios de conjuro</label><h4 style="margin-top:14px">Recursos</h4>${eligible.length?eligible.map(x=>`<label><input class="check rest-resource" type="checkbox" value="${x.i}" checked> Recuperar ${esc(x.r.name)}</label>`).join(''):'<div class="empty">No hay recursos configurados para este descanso.</div>'}`;document.getElementById('restModal').classList.add('open')}
function closeRest(){document.getElementById('restModal').classList.remove('open')}function applyRest(){const c=ch();if(document.getElementById('restDeath')?.checked)c.death={success:0,fail:0};if(restType==='long'){if(document.getElementById('restHp')?.checked){c.hp.current=c.hp.max;c.hp.temp=0}if(document.getElementById('restHit')?.checked)c.hitDice.current=Math.min(c.hitDice.max,c.hitDice.current+Math.max(1,Math.floor(c.hitDice.max/2)))}if(document.getElementById('restSlots')?.checked){Object.values(c.spellcasting.slots).forEach(s=>{s.spent=0;s.used=Array.from({length:Math.max(0,Number(s.total)||0)},()=>false)})}document.querySelectorAll('.rest-resource:checked').forEach(el=>{const r=c.resources[Number(el.value)];if(r)r.current=r.max});autoSave();closeRest();render()}
function exportState(){
  const currentCharacter=ch();
  syncAutoWeapons(currentCharacter);
  const characterName=String(currentCharacter?.name||'Personaje').trim()||'Personaje';
  const safeName=characterName.replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();
  const exportedState={
    theme:state.theme,
    activeId:currentCharacter.id,
    characters:[structuredClone(currentCharacter)]
  };
  const blob=new Blob([JSON.stringify(exportedState,null,2)],{type:'application/json'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=`Ficha-${safeName}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
}function chooseImportConflict(kind,name,language='es'){
  let overlay=document.getElementById('importConflictOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='importConflictOverlay';
    overlay.className='import-conflict-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-hidden','true');
    overlay.innerHTML=`<div class="import-conflict-dialog"><div class="import-conflict-heading"><span class="import-conflict-symbol" aria-hidden="true">!</span><div><h3 data-role="title"></h3></div></div><p class="import-conflict-message" data-role="message"></p><div class="import-conflict-actions"><button type="button" data-choice="cancel"></button><button type="button" class="import-conflict-copy" data-choice="copy"></button><button type="button" class="primary" data-choice="update"></button></div></div>`;
    document.body.appendChild(overlay);
  }
  const english=language==='en';
  overlay.querySelector('[data-role="title"]').textContent=english?'Import conflict':'Conflicto de importación';
  overlay.querySelector('[data-role="message"]').textContent=english
    ?`The ${kind==='world'?'world':'character'} "${name}" already exists, but the imported file contains changes. What would you like to do?`
    :`El ${kind==='world'?'mundo':'personaje'} "${name}" ya existe, pero el archivo importado contiene cambios. ¿Qué quieres hacer?`;
  overlay.querySelector('[data-choice="cancel"]').textContent=english?'Cancel':'Cancelar';
  overlay.querySelector('[data-choice="copy"]').textContent=english?'Create new entry':'Crear nueva entrada';
  overlay.querySelector('[data-choice="update"]').textContent=english?'Update local copy':'Actualizar copia local';
  return new Promise(resolve=>{
    let settled=false;
    const finish=choice=>{
      if(settled)return;
      settled=true;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      document.removeEventListener('keydown',handleKey);
      resolve(choice);
    };
    const handleKey=event=>{if(event.key==='Escape')finish('cancel')};
    overlay.querySelectorAll('[data-choice]').forEach(button=>{button.onclick=()=>finish(button.dataset.choice)});
    overlay.onclick=event=>{if(event.target===overlay)finish('cancel')};
    document.addEventListener('keydown',handleKey);
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>overlay.querySelector('[data-choice="update"]')?.focus());
  });
}function characterImportSignature(source,index=0){
  const comparable=normalizeCharacter(structuredClone(source),index);
  Object.values(comparable.spellcasting.slots).forEach(slot=>delete slot.used);
  comparable.spells.forEach(spell=>{spell.prepared=!!spell.prepared});
  return JSON.stringify(comparable);
}
const importInput=document.getElementById('importInput');
if(importInput)importInput.addEventListener('change',event=>{
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.characters)||!data.characters.length)throw new Error();
      const addedCharacters=[];
      const updatedCharacters=[];
      let unchangedCount=0;
      let cancelledCount=0;
      for(const [index,character] of data.characters.entries()){
        const imported=normalizeCharacter(structuredClone(character),state.characters.length+index);
        imported.id=String(imported.id||uid());
        const existingIndex=state.characters.findIndex(current=>String(current.id)===imported.id);
        if(existingIndex>=0){
          const current=normalizeCharacter(structuredClone(state.characters[existingIndex]),existingIndex);
          if(characterImportSignature(current,existingIndex)===characterImportSignature(imported,existingIndex)){
            unchangedCount++;
            continue;
          }
          const name=imported.name||current.name||'Sin nombre';
          const choice=await chooseImportConflict('character',name,'es');
          if(choice==='update'){
            state.characters[existingIndex]=imported;
            updatedCharacters.push(imported);
          }else if(choice==='copy'){
            const usedIds=new Set([...state.characters,...addedCharacters].map(character=>String(character.id)));
            do{imported.id=uid()}while(usedIds.has(imported.id));
            addedCharacters.push(imported);
          }else{
            cancelledCount++;
          }
          continue;
        }
        addedCharacters.push(imported);
      }
      if(!addedCharacters.length&&!updatedCharacters.length){
        const message=cancelledCount
          ?'No se realizó ningún cambio.'
          :'No se añadieron personajes: todos los del archivo ya estaban actualizados.';
        alert(message);
        return;
      }
      state.characters.push(...addedCharacters);
      const changedCharacters=[...updatedCharacters,...addedCharacters];
      const requestedActiveId=String(data.activeId||'');
      state.activeId=changedCharacters.find(character=>character.id===requestedActiveId)?.id||changedCharacters[0].id;
      autoSave();
      render();
      const messages=[];
      if(addedCharacters.length)messages.push(`${addedCharacters.length} personaje${addedCharacters.length===1?' añadido':'s añadidos'}.`);
      if(updatedCharacters.length)messages.push(`${updatedCharacters.length} personaje${updatedCharacters.length===1?' actualizado':'s actualizados'}.`);
      if(unchangedCount)messages.push(`${unchangedCount} ya ${unchangedCount===1?'estaba actualizado':'estaban actualizados'}.`);
      if(cancelledCount)messages.push(`${cancelledCount} ${cancelledCount===1?'actualización cancelada':'actualizaciones canceladas'}.`);
      alert(messages.join(' '));
    }catch(error){
      alert('El archivo JSON no es válido.');
    }
  };
  reader.readAsText(file);
  event.target.value='';
});
function syncSharedTheme(){
  const sharedTheme=readThemePreference(state.theme);
  if(sharedTheme===state.theme)return;
  writeThemePreference(sharedTheme);
  state.theme=sharedTheme;
  autoSave();
  render();
}
window.addEventListener('pageshow',syncSharedTheme);
window.addEventListener('storage',event=>{if(event.key===SHARED_THEME_KEY)syncSharedTheme()});
render();
window.addEventListener('load',()=>{
  updateCombatButtonPosition();
  initCombatOverlay();
});
window.addEventListener('resize',updateCombatButtonPosition);
window.addEventListener('scroll',updateCombatButtonPosition,{passive:true});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&document.getElementById('combatModal')?.classList.contains('open')){
    closeCombatManager();
  }
});
