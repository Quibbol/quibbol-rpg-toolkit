  <title>Panel de Mundo — Quibbol’s RPG Toolkit</title>
<script src="../../assets/js/json-formats.js"></script>
<script id="theme-bootstrap">
(()=>{
  const root=document.documentElement;
  root.classList.add('theme-booting');
  if(location.protocol!=="file:"&&/\/index\.html$/i.test(location.pathname)){
    const cleanAppUrl=new URL(location.href);
    cleanAppUrl.pathname=cleanAppUrl.pathname.replace(/index\.html$/i,"");
    history.replaceState(null,"",cleanAppUrl.href);
  }
  const parse=raw=>{
    if(!raw)return null;
    try{const value=JSON.parse(raw);if(value&&(value.theme==='dark'||value.theme==='light'))return {theme:value.theme,updatedAt:Number(value.updatedAt)||0};}
    catch(error){if(raw==='dark'||raw==='light')return {theme:raw,updatedAt:0};}
    return null;
  };
  let fallback='dark';
  try{const legacy=localStorage.getItem('ulpeTheme');if(legacy==='light'||legacy==='dark')fallback=legacy;}catch(error){}
  let stored=null;
  try{stored=parse(localStorage.getItem('quibbolRpgToolkit:theme')??localStorage.getItem('appsRolTheme'));}catch(error){}
  const windowValue=String(window.name||'');
  const fromWindow=windowValue.startsWith('quibbolRpgToolkit:theme:')?parse(windowValue.slice('quibbolRpgToolkit:theme:'.length)):(windowValue.startsWith('appsRolTheme:')?parse(windowValue.slice('appsRolTheme:'.length)):null);
  const newest=[stored,fromWindow].filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  const urlTheme=new URLSearchParams(location.search).get('theme');
  root.dataset.theme=urlTheme==='light'||urlTheme==='dark'?urlTheme:(newest?.theme||fallback);
})();
</script>
<style id="theme-bootstrap-style">html.theme-booting *,html.theme-booting *::before,html.theme-booting *::after{transition:none!important;animation:none!important}</style>
  <style>
    :root{
      --bg:#111318; --panel:#1b1f27; --panel2:#232936; --text:#ece7dc;
      --muted:#a9adba; --accent:#d0a85c; --danger:#b44747; --ok:#4f8a5b;
      --border:#343b49;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:linear-gradient(180deg,#0d0f13,#151922); color:var(--text);
    }
    header{
      padding:20px; border-bottom:1px solid var(--border); background:#0d1015;
      position:sticky; top:0; z-index:10;
    }
    header h1{margin:0 0 6px;font-size:1.6rem}
    header p{margin:0;color:var(--muted)}
    .toolbar{
      display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;
    }
    button, select, input, textarea{
      background:var(--panel2); color:var(--text); border:1px solid var(--border);
      border-radius:8px; padding:9px 10px;
    }
    button{cursor:pointer}
    button:hover{filter:brightness(1.12)}
    .primary{background:#5f4924;border-color:#8c6d35}
    .danger{background:#532929;border-color:#804242}
    main{max-width:1400px;margin:auto;padding:18px}
    .grid{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:16px;
    }
    /* Un único evento conserva el ancho que tendría cada tarjeta en una fila de dos.
       Con dos, tres o más eventos, la rejilla mantiene exactamente el comportamiento de v1. */
    #eventsGrid > .card:only-child{
      width:calc((100% - 16px) / 2);
    }
    @media(max-width:675px){
      #eventsGrid > .card:only-child{width:100%}
    }
    .card{
      background:rgba(27,31,39,.96); border:1px solid var(--border);
      border-radius:14px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.22);
    }
    .card h2,.card h3{margin-top:0}
    .event-card-header{
      display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;margin-bottom:12px;
    }
    .event-title-area{min-width:0}
    .event-title-display{
      margin:0;
      font-size:1.5rem;
      line-height:1.2;
      overflow-wrap:anywhere;
    }
    .event-title-input{
      font-size:1.25rem;font-weight:700;padding:7px 9px;background:#151922;
    }
    .event-card-actions{
      display:flex;gap:6px;align-items:center;
    }
    .square-button{
      width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;
      border-radius:3px;font-size:1rem;line-height:1;
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
    input,select,textarea{width:100%}
    textarea{min-height:90px;resize:vertical}
    .progress-wrap{margin:12px 0}
    .progress{
      height:14px;background:#0e1117;border:1px solid var(--border);
      border-radius:999px;overflow:hidden;
    }

    .floating-nav{
      position:fixed;
      left:18px;
      top:var(--floating-nav-panel-top,76px);
      bottom:18px;
      z-index:1000;
      width:max-content;
      min-width:180px;
      max-width:min(420px,calc(100vw - 36px));

      pointer-events:none;

    :root{
      --body-gradient:linear-gradient(180deg,#0d0f13,#151922);
      --header-bg:#0d1015;
      --card-bg:rgba(27,31,39,.96);
      --surface:#171b22;
      --surface-deep:#11151c;
      --surface-input:#151922;
      --shadow:rgba(0,0,0,.22);
    }
    html[data-theme="light"]{
      --bg:#f3f0e8;
      --panel:#ffffff;
      --panel2:#f3efe5;
      --text:#292821;
      --muted:#68675f;
      --accent:#9a6d22;
      --danger:#a34444;
      --ok:#3f7b4c;
      --border:#cfc8b8;
      --body-gradient:linear-gradient(180deg,#ebe7dc,#f8f6f0);
      --header-bg:#fbf9f3;
      --card-bg:rgba(255,255,255,.97);
      --surface:#f5f1e8;
      --surface-deep:#ece7dc;
      --surface-input:#fffdf8;
      --shadow:rgba(67,55,35,.13);
    }
    body{background:var(--body-gradient)}
    header{background:var(--header-bg)}
    .card{background:var(--card-bg);box-shadow:0 10px 30px var(--shadow)}
    #regionsCard > .region{background:var(--card-bg);box-shadow:0 8px 22px var(--shadow)}
    .event-title-input,.region-title-input{background:var(--surface-input)}
    .political-row,.city-card,.character-card,.diagnosis-tag,.milestone-row,.log-item{background:var(--surface)}
    .city-rating,.diagnosis-editor,.floating-nav{background:var(--surface-deep)}
    .suggestion-chip{background:var(--panel)}
    .progress{background:var(--surface-deep)}
    .rating-dot,.mini-dot{background:var(--surface-deep)}

    html[data-theme="light"] .danger{background:#f1d6d3;border-color:#c4837d}

    .card,
    #regionsCard > .region,
    button,
    select,
    input,
    textarea,
    .political-row,
    .city-card,
    .character-card,
    .diagnosis-tag,

    .log-item,
    .city-rating,
    .diagnosis-editor,

const UI_TRANSLATIONS_REVERSE = Object.fromEntries(
  Object.entries(UI_TRANSLATIONS).map(([es,en])=>[en,es])
);

const SHARED_THEME_KEY="quibbolRpgToolkit:theme";
const LEGACY_SHARED_THEME_KEY="appsRolTheme";
const WORLDBUILDING_THEME_KEY="quibbolRpgToolkit:worldbuilding:theme";
const LEGACY_WORLDBUILDING_THEME_KEY="ulpeTheme";
const WORLDBUILDING_LANGUAGE_KEY="quibbolRpgToolkit:worldbuilding:language";
const LEGACY_WORLDBUILDING_LANGUAGE_KEY="ulpeLanguage";
const THEME_WINDOW_PREFIX="quibbolRpgToolkit:theme:";
function parseThemePreference(raw){
  if(!raw)return null;
  try{
    const value=JSON.parse(raw);
    if(value&&(value.theme==="dark"||value.theme==="light"))return {theme:value.theme,updatedAt:Number(value.updatedAt)||0};
  }catch(error){
    if(raw==="dark"||raw==="light")return {theme:raw,updatedAt:0};
  }
  return null;
}
function readThemePreference(fallback="dark"){
  const urlTheme=new URLSearchParams(location.search).get("theme");
  if(urlTheme==="dark"||urlTheme==="light"){
    try{const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete("theme");history.replaceState(null,"",cleanUrl.href);}catch(error){}
    return urlTheme;
  }
  let stored=null;
  try{stored=parseThemePreference(localStorage.getItem(SHARED_THEME_KEY)??localStorage.getItem(LEGACY_SHARED_THEME_KEY));}catch(error){}
  const fromWindow=String(window.name||"").startsWith(THEME_WINDOW_PREFIX)
    ?parseThemePreference(String(window.name).slice(THEME_WINDOW_PREFIX.length))
    :null;
  const newest=[stored,fromWindow].filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  return newest?.theme||(fallback==="light"?"light":"dark");
}
function writeThemePreference(theme){
  const preference={theme:theme==="light"?"light":"dark",updatedAt:Date.now()};
  const serialized=JSON.stringify(preference);
  try{localStorage.setItem(SHARED_THEME_KEY,serialized);}catch(error){}
  try{window.name=THEME_WINDOW_PREFIX+serialized;}catch(error){}
  return preference.theme;
}

function translateText(value){
  const clean = String(value ?? "").trim();
  if(!clean) return value;
  if(currentLanguage === "en"){
    return UI_TRANSLATIONS[clean] ?? clean;
  }
  return UI_TRANSLATIONS_REVERSE[clean] ?? clean;
}

function translateAttribute(element,attribute){
  if(!element.hasAttribute(attribute)) return;
  const sourceKey = `i18n${attribute.replace(/[^a-z0-9]/gi,"")}`;
  if(!element.dataset[sourceKey]){
    const current = element.getAttribute(attribute);
    const canonical = UI_TRANSLATIONS_REVERSE[current] ?? current;
    element.dataset[sourceKey] = canonical;
  }
  const canonical = element.dataset[sourceKey];
  element.setAttribute(
    attribute,
    currentLanguage === "en" ? (UI_TRANSLATIONS[canonical] ?? canonical) : canonical
  );
}

function shouldSkipTranslation(node){
  const parent = node.parentElement;
  if(!parent) return true;
  return Boolean(parent.closest(
    "input,textarea,.event-title-display,.region-title-display,.item-title,.relation-name,.log-item strong,.log-item span"
  ));
}

function applyLanguage(){
  document.documentElement.lang = currentLanguage;

  document.querySelectorAll("[data-i18n]").forEach(element=>{
    const canonical = element.dataset.i18n;
    element.textContent = currentLanguage === "en"
      ? (UI_TRANSLATIONS[canonical] ?? canonical)
      : canonical;
  });

  document.querySelectorAll("option").forEach(option=>{
    if(!option.dataset.i18nValue){
      option.dataset.i18nValue = option.value || option.textContent.trim();
    }
    if(!option.dataset.i18nSource){
      const shown = option.textContent.trim();
      option.dataset.i18nSource = UI_TRANSLATIONS_REVERSE[shown] ?? shown;
    }
    option.value = option.dataset.i18nValue;
    const canonical = option.dataset.i18nSource;
    option.textContent = currentLanguage === "en"
      ? (UI_TRANSLATIONS[canonical] ?? canonical)
      : canonical;
  });

  const walker = document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(shouldSkipTranslation(node)) return;
    const raw = node.nodeValue;
    const trimmed = raw.trim();
    if(!trimmed) return;
    const canonical = UI_TRANSLATIONS_REVERSE[trimmed] ?? trimmed;
    const translated = currentLanguage === "en"
      ? (UI_TRANSLATIONS[canonical] ?? canonical)
      : canonical;
    if(translated !== trimmed){
      node.nodeValue = raw.replace(trimmed,translated);
    }
  });

  document.querySelectorAll("[placeholder],[title],[aria-label]").forEach(element=>{
    translateAttribute(element,"placeholder");
    translateAttribute(element,"title");
    translateAttribute(element,"aria-label");
  });

  const languageButton = document.getElementById("languageToggle");
  if(languageButton){
    const glyph = languageButton.querySelector(".language-glyph");
    if(glyph){
      glyph.textContent = currentLanguage === "es" ? "ES" : "EN";
    }

    const label = currentLanguage === "es"
      ? "Cambiar idioma a inglés"
      : "Switch language to Spanish";
    languageButton.title = label;
    languageButton.setAttribute("aria-label",label);
  }

  applyTheme();
}

function getNavigationOffset(){
  const selectors=[
    "header",
    ".app-header",
    ".topbar",
    ".top-bar",
    ".sticky-header",
    "[data-app-header]"
  ];

  let navigationOffset=16;
  let headerBottom=0;

  selectors.forEach(selector=>{
    document.querySelectorAll(selector).forEach(element=>{
      const style=getComputedStyle(element);
      const rect=element.getBoundingClientRect();
      const isVisible=style.display!=="none" && style.visibility!=="hidden" && rect.height>0;
      const isRelevant=style.position==="fixed" || style.position==="sticky" || selector==="header";

      if(isVisible && isRelevant){
        navigationOffset=Math.max(navigationOffset,Math.ceil(rect.height)+16);

        if(rect.bottom>0 && rect.top<=0){
          headerBottom=Math.max(headerBottom,Math.ceil(rect.bottom));
        }else if(style.position==="fixed" || style.position==="sticky"){
          headerBottom=Math.max(headerBottom,Math.ceil(rect.bottom));
        }
      }
    });
  });

  const buttonTop=Math.max(14,headerBottom+12);
  const panelTop=buttonTop+58;

  document.documentElement.style.setProperty("--nav-scroll-offset",`${navigationOffset}px`);
  document.documentElement.style.setProperty("--floating-nav-button-top",`${buttonTop}px`);
  document.documentElement.style.setProperty("--floating-nav-panel-top",`${panelTop}px`);

  return navigationOffset;
}

function navigateTo(targetId){
  const target=document.getElementById(targetId);
  if(!target) return;

  const offset=getNavigationOffset();
  const targetTop=target.getBoundingClientRect().top + window.scrollY - offset;

  window.scrollTo({
    top:Math.max(0,targetTop),
    behavior:"smooth"
  });
}

function floatingNavItem(targetId,label,sub=false){
  return `
    <button type="button"
      class="floating-nav-link ${sub ? "sub" : ""}"
      data-nav-target="${escapeAttr(targetId)}"
      onclick="navigateTo('${escapeAttr(targetId)}')">
      <span class="floating-nav-dot"></span>
      <span>${escapeHtml(label)}</span>
    </button>
  `;
}

      ${events || '<div class="floating-nav-empty">No hay eventos.</div>'}
    </div>
    <div class="floating-nav-group">
      <div class="floating-nav-label">Regiones</div>
      ${regions || '<div class="floating-nav-empty">No hay regiones.</div>'}
    </div>
  `;
  updateFloatingNavActive();
}

function updateFloatingNavActive(){
  const links=[...document.querySelectorAll("[data-nav-target]")];
  const activationLine=getNavigationOffset()+8;
  let active=null;
  let best=-Infinity;

  links.forEach(link=>{
    const target=document.getElementById(link.dataset.navTarget);
    if(!target) return;
    const top=target.getBoundingClientRect().top;
    if(top<=activationLine && top>best){
      best=top;
      active=link;
    }
  });

  if(!active){
    active=links.find(link=>{
      const target=document.getElementById(link.dataset.navTarget);
      return target && target.getBoundingClientRect().top>=0;
    }) || null;
  }

  links.forEach(link=>link.classList.toggle("active",link===active));
}

let floatingNavFrame=0;
window.addEventListener("scroll",()=>{
  cancelAnimationFrame(floatingNavFrame);
  floatingNavFrame=requestAnimationFrame(updateFloatingNavActive);
},{passive:true});

window.addEventListener("resize",()=>{
  getNavigationOffset();
  updateFloatingNavActive();
},{passive:true});

function createWorldFileId(){
  return "world-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);

function loadWorldLibrary(){
  try{
    const current=localStorage.getItem(WORLD_LIBRARY_KEY);
    const legacy=current?null:localStorage.getItem(LEGACY_WORLD_LIBRARY_KEY);
    const saved=JSON.parse(current??legacy);
    if(saved && Array.isArray(saved.worlds) && saved.worlds.length){
      const activeExists=saved.worlds.some(file=>file.id===saved.activeId);
      const library={activeId:activeExists?saved.activeId:saved.worlds[0].id,worlds:saved.worlds};
      if(!current)localStorage.setItem(WORLD_LIBRARY_KEY,JSON.stringify(library));
      return library;
    }
  }catch(error){}
  let initial;
  try{
    const legacy=localStorage.getItem(LEGACY_WORLD_KEY);
    initial=legacy?JSON.parse(legacy):structuredClone(DEFAULT_STATE);
  }catch(error){
    initial=structuredClone(DEFAULT_STATE);
  }
  const id=createWorldFileId();
  const library={activeId:id,worlds:[{id,state:initial}]};
  localStorage.setItem(WORLD_LIBRARY_KEY,JSON.stringify(library));
  return library;
}

let worldLibrary=loadWorldLibrary();
let activeWorldId=worldLibrary.activeId;

const WORLD_UNDO_LIMIT=25;
const worldUndoHistory=new Map();
const worldUndoBaselines=new Map();
const WORLD_UNDO_IGNORED_KEYS=new Set([
  "theme","language","editingWorldName","editingTitle","editingName","editingDiagnosis",
  "expanded","cardExpanded","traitsSectionExpanded","actionsSectionExpanded",
  "defensesSectionExpanded","actionSubsectionsExpanded","selectedDay"
]);
let worldUndoSuppressed=false;

function cloneUndoComparable(value){
  if(Array.isArray(value)) return value.map(cloneUndoComparable);
  if(!value || typeof value!=="object") return value;
  return Object.fromEntries(Object.entries(value)
    .filter(([key])=>!WORLD_UNDO_IGNORED_KEYS.has(key) && !key.startsWith("editing") && !key.endsWith("Expanded"))
    .map(([key,item])=>[key,cloneUndoComparable(item)]));
}

function createWorldUndoSnapshot(value=state){
  return structuredClone(value);
}

function worldUndoSignature(snapshot){
  return JSON.stringify(cloneUndoComparable(snapshot));
}

function getActiveWorldUndoStack(){
  if(!worldUndoHistory.has(activeWorldId)) worldUndoHistory.set(activeWorldId,[]);
  return worldUndoHistory.get(activeWorldId);
}

function ensureWorldUndoBaseline(){
  if(!worldUndoBaselines.has(activeWorldId)){
    worldUndoBaselines.set(activeWorldId,createWorldUndoSnapshot());
  }
}

function resetActiveWorldUndoTracking(clearHistory=false){
  if(clearHistory) worldUndoHistory.set(activeWorldId,[]);
  worldUndoBaselines.set(activeWorldId,createWorldUndoSnapshot());
  updateUndoButton();
}

function updateUndoButton(){
  const button=document.getElementById("undoButton");
  if(!button) return;
  const available=getActiveWorldUndoStack().length>0;
  button.disabled=!available;
  const label=available
    ? (currentLanguage==="en" ? "Undo last change" : "Deshacer último cambio")
    : (currentLanguage==="en" ? "No changes to undo" : "No hay cambios que deshacer");
  button.title=label;
  button.setAttribute("aria-label",label);
}

function captureWorldUndoStep(){
  const current=createWorldUndoSnapshot();
  const previous=worldUndoBaselines.get(activeWorldId);
  if(previous && worldUndoSignature(previous)!==worldUndoSignature(current)){
    const stack=getActiveWorldUndoStack();
    stack.push(previous);
    if(stack.length>WORLD_UNDO_LIMIT) stack.splice(0,stack.length-WORLD_UNDO_LIMIT);
  }
  worldUndoBaselines.set(activeWorldId,current);
  updateUndoButton();
}

function undoLastWorldChange(){
  const stack=getActiveWorldUndoStack();
  if(!stack.length){
    updateUndoButton();
    return;
  }
  const previous=stack.pop();
  worldUndoSuppressed=true;
  state=normalizeState(createWorldUndoSnapshot(previous));
  state.settings.theme=currentTheme;
  state.settings.language=currentLanguage;
  worldUndoBaselines.set(activeWorldId,createWorldUndoSnapshot());
  persistWorldLibrary();
  render();
  worldUndoSuppressed=false;
  const indicator=document.getElementById("worldSaveState");
  if(indicator) indicator.textContent=currentLanguage==="en" ? "Change undone" : "Cambio deshecho";
}

function randomInteger(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function randomChoice(values){
  return values[Math.floor(Math.random()*values.length)];
}

function shuffledCopy(values){
  const result=values.slice();
  for(let index=result.length-1;index>0;index--){
    const target=Math.floor(Math.random()*(index+1));
    [result[index],result[target]]=[result[target],result[index]];
  }
  return result;
}

function randomEntityId(prefix){
  const suffix=typeof crypto!=="undefined" && typeof crypto.randomUUID==="function"
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
  return `${prefix}-${suffix}`;
}

function materializeNarrativeText(value,context){
  return String(value ?? "").replace(/\{(region|city)(\d)\}/g,(_,kind,index)=>{
    const collection=kind==="region" ? context.regions : context.cities;
    return collection[Number(index)] || "un lugar lejano";
  });
}

function createNarrativeContext(seed,useExistingContext=false){
  const fallback={
    regions:seed.regions.map(spec=>randomChoice(spec.names)),
    cities:seed.regions.map(spec=>randomChoice(spec.cities))
  };
  if(!useExistingContext) return fallback;
  const existing=shuffledCopy(state.regions || []);
  if(!existing.length){
    return {
      regions:["una región fronteriza","la región central","las tierras del sur","una comarca aislada"],
      cities:["la capital","una ciudad amurallada","un importante puerto comercial","un asentamiento remoto"]
    };
  }
  return {
    regions:Array.from({length:4},(_,index)=>existing[index%existing.length]?.name || fallback.regions[index]),
    cities:Array.from({length:4},(_,index)=>{
      const region=existing[index%existing.length];
      const city=region?.cities?.length ? randomChoice(region.cities) : null;
      return city?.name || `la principal ciudad de ${region?.name || fallback.regions[index]}`;
    })
  };
}

function buildNarrativeGeneration({eventCount=0,regionCount=0,useExistingContext=false}={}){
  const seed=randomChoice(NARRATIVE_SEEDS);
  const context=createNarrativeContext(seed,useExistingContext);
  const allRegions=seed.regions.map((spec,index)=>{
    const cityId=randomEntityId("city");
    return {
      id:randomEntityId("region"),
      name:context.regions[index],
      editingName:false,
      diagnosis:randomChoice(spec.diagnoses),
      editingDiagnosis:false,
      stability:randomChoice(spec.stability),
      military:randomChoice(spec.military),
      politics:{
        government:randomInteger(1,5),
        legitimacy:randomInteger(1,5),
        corruption:randomInteger(1,5),
        religion:randomInteger(1,5),
        magic:randomInteger(1,5)
      },
      cities:[{
        id:cityId,
        name:context.cities[index],
        editingName:false,
        state:randomChoice(spec.cityStates),
        population:randomChoice(spec.populations),
        notes:materializeNarrativeText(spec.notes,context),
        expanded:false,
        ratings:{
          security:randomInteger(1,5),
          economy:randomInteger(1,5),
          corruption:randomInteger(1,5),
          legitimacy:randomInteger(1,5)
        }
      }],
      characters:[],
      notes:materializeNarrativeText(spec.notes,context)
    };
  });
  const safeRegionCount=Math.min(4,Math.max(0,Math.round(Number(regionCount)||0)));
  const safeEventCount=Math.min(3,Math.max(0,Math.round(Number(eventCount)||0)));
  const regions=shuffledCopy(allRegions).slice(0,safeRegionCount);
  const events=shuffledCopy(seed.events).slice(0,safeEventCount).map(template=>{
    const milestoneCount=randomInteger(2,Math.min(5,template.milestones.length));
    const eventName=materializeNarrativeText(randomChoice(template.names),context);
    return {
      id:randomEntityId("evento"),
      name:eventName,
      editingTitle:false,
      status:randomChoice(STATUS.slice(0,5)),
      progress:0,
      trigger:materializeNarrativeText(template.trigger,context),
      phase:materializeNarrativeText(template.phase,context),
      notes:`${materializeNarrativeText(template.notes,context)}\n\nPremisa compartida: ${seed.premise}`,
      milestones:template.milestones.slice(0,milestoneCount).map((text,index)=>({
        text:materializeNarrativeText(text,context),
        done:false,
        currentSituation:index===0
          ? `Los primeros indicios ya afectan a ${context.regions[index % context.regions.length]}.`
          : "Este paso todavía no se ha desencadenado.",
        involvedActivities:"Las autoridades, comunidades locales y grupos interesados intentan inclinar el resultado a su favor.",
        availableAdventures:"Investigar los indicios, negociar con los implicados o intervenir antes de que la situación avance.",
        directorNotes:`Mantener este hito conectado con la premisa: ${seed.premise}`
      }))
    };
  });
  return {events,regions,premise:seed.premise};
}

function showContentCreationDialog({symbol,title,message,actions,focusChoice,dismissChoice="cancel"}){
  let overlay=document.getElementById("contentCreationOverlay");
  if(!overlay){
    overlay=document.createElement("div");
    overlay.id="contentCreationOverlay";
    overlay.className="import-conflict-overlay";
    overlay.setAttribute("role","dialog");
    overlay.setAttribute("aria-modal","true");
    overlay.setAttribute("aria-hidden","true");
    document.body.appendChild(overlay);
  }
  const symbolMarkup=symbol==="＋"
    ? '<span class="header-create-glyph"></span>'
    : `<span>${symbol}</span>`;
  overlay.innerHTML=`
    <div class="import-conflict-dialog">
      <div class="import-conflict-heading">
        <span class="import-conflict-symbol content-creation-symbol" aria-hidden="true">${symbolMarkup}</span>
        <div><h3>${title}</h3></div>
      </div>
      <p class="import-conflict-message">${message}</p>
      <div class="import-conflict-actions">
        ${actions.map(action=>`<button type="button" class="${action.className || ""}" data-choice="${action.choice}">${action.label}</button>`).join("")}
      </div>
    </div>`;
  return new Promise(resolve=>{
    let settled=false;
    const finish=choice=>{
      if(settled) return;
      settled=true;
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden","true");
      document.removeEventListener("keydown",handleKey);
      resolve(choice);
    };
    const handleKey=event=>{if(event.key==="Escape") finish(dismissChoice)};
    overlay.querySelectorAll("[data-choice]").forEach(button=>{button.onclick=()=>finish(button.dataset.choice)});
    overlay.onclick=event=>{if(event.target===overlay) finish(dismissChoice)};
    document.addEventListener("keydown",handleKey);
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
    requestAnimationFrame(()=>overlay.querySelector(`[data-choice="${focusChoice}"]`)?.focus());
  });
}

function chooseContentCreationAction(kind){
  const english=currentLanguage==="en";
  const isEvent=kind==="event";
  const singular=english ? (isEvent?"event":"region") : (isEvent?"evento":"región");
  const plural=english ? (isEvent?"events":"regions") : (isEvent?"eventos":"regiones");
  return showContentCreationDialog({
    symbol:"＋",
    title:english ? `Add ${singular}` : `Añadir ${singular}`,
    message:english ? `Choose how you want to add ${plural} to the current world.` : `Elige cómo quieres añadir ${plural} al mundo actual.`,
    focusChoice:"new",
    actions:[
      {choice:"cancel",label:english?"Cancel":"Cancelar"},
      {choice:"new",className:"primary",label:english?`Create new ${singular}`:`Crear nuev${isEvent?"o":"a"} ${singular}`},
      {choice:"1",className:"import-conflict-copy",label:english?`Generate one random ${singular}`:`Generar ${isEvent?"un":"una"} ${singular} aleatori${isEvent?"o":"a"}`},
      {choice:"multiple",className:"import-conflict-copy",label:english?`Generate several random ${plural}`:`Generar vari${isEvent?"os":"as"} ${plural} aleatori${isEvent?"os":"as"}`}
    ]
  });
}

function chooseGeneratedContentCount(kind){

      }))

}

async function openEventCreationDialog(){
  while(true){
    let choice=await chooseContentCreationAction("event");
    if(choice==="cancel") return;
    if(choice==="multiple"){
      choice=await chooseGeneratedContentCount("event");
      if(choice==="back") continue;
    }
    if(choice==="new") addEvent();
    else addGeneratedEvents(Number(choice));
    return;
  }
}

    return;

function persistWorldLibrary(){
  const current=worldLibrary.worlds.find(file=>file.id===activeWorldId);
  if(current) current.state=structuredClone(state);
  worldLibrary.activeId=activeWorldId;
  localStorage.setItem(WORLD_LIBRARY_KEY,JSON.stringify(worldLibrary));
  localStorage.setItem(LEGACY_WORLD_KEY,JSON.stringify(state));
  const indicator=document.getElementById("worldSaveState");
  if(indicator) indicator.textContent=currentLanguage==="en"?"Saved":"Guardado";
}

function renderWorldSelector(){
  const select=document.getElementById("worldFileSelect");
  if(!select) return;
  select.innerHTML="";
  worldLibrary.worlds.forEach(file=>{
    const option=document.createElement("option");
    option.value=file.id;
    option.textContent=file.state?.settings?.worldName || (currentLanguage==="en"?"Untitled world":"Mundo sin nombre");
    select.appendChild(option);
  });
  select.value=activeWorldId;
}

function selectWorldFile(id){
  const next=worldLibrary.worlds.find(file=>file.id===id);
  if(!next || id===activeWorldId) return;
  autoSave();
  activeWorldId=id;
  worldLibrary.activeId=id;
  state=normalizeState(structuredClone(next.state));
  state.settings.theme=currentTheme;
  currentLanguage=state.settings.language;
  resetActiveWorldUndoTracking(false);
  localStorage.setItem(WORLDBUILDING_THEME_KEY,currentTheme);
  localStorage.setItem(WORLDBUILDING_LANGUAGE_KEY,currentLanguage);
  persistWorldLibrary();
  render();
}

function addWorldFile(){
  const fallback=currentLanguage==="en"?"World "+(worldLibrary.worlds.length+1):"Mundo "+(worldLibrary.worlds.length+1);
  const requested=prompt(currentLanguage==="en"?"New world name:":"Nombre del nuevo mundo:",fallback);
  if(requested===null) return;
  autoSave();
  const fresh=structuredClone(DEFAULT_STATE);
  fresh.settings.worldName=String(requested).trim() || fallback;
  fresh.settings.theme=currentTheme;
  fresh.settings.language=currentLanguage;
  const id=createWorldFileId();
  const normalized=normalizeState(fresh);
  worldLibrary.worlds.push({id,state:normalized});
  activeWorldId=id;
  worldLibrary.activeId=id;
  state=normalized;
  resetActiveWorldUndoTracking(true);
  persistWorldLibrary();
  render();
}

function renameWorldFile(){
  const currentName=state.settings.worldName || "Mundo";
  const requested=prompt(currentLanguage==="en"?"World name:":"Nombre del mundo:",currentName);
  if(requested===null) return;
  state.settings.worldName=String(requested).trim() || currentName;
  state.settings.editingWorldName=false;
  autoSave();
  render();
}

function deleteWorldFile(){
  if(worldLibrary.worlds.length===1){
    alert(currentLanguage==="en"?"At least one world must exist.":"Debe existir al menos un mundo.");
    return;
  }
  const name=state.settings.worldName || "Mundo";
  if(!confirm((currentLanguage==="en"?"Delete ":"¿Eliminar ")+name+"?")) return;
  worldLibrary.worlds=worldLibrary.worlds.filter(file=>file.id!==activeWorldId);
  const next=worldLibrary.worlds[0];
  activeWorldId=next.id;
  worldLibrary.activeId=next.id;
  state=normalizeState(structuredClone(next.state));
  state.settings.theme=currentTheme;
  currentLanguage=state.settings.language;
  resetActiveWorldUndoTracking(false);
  persistWorldLibrary();
  render();
}

function clampRating(value){
  const number = Number(value);
  return Number.isFinite(number) ? Math.min(5,Math.max(0,Math.round(number))) : 0;
}

function relationKey(idA,idB){
  return [String(idA),String(idB)].sort().join("::");
}

function normalizeState(data){
  const source = data && typeof data === "object" && !Array.isArray(data)
    ? data
    : structuredClone(DEFAULT_STATE);

  const sourceSettings = source.settings && typeof source.settings === "object" && !Array.isArray(source.settings)
    ? source.settings
    : {};

  const normalized = {
    settings:{
      worldName:String(sourceSettings.worldName ?? source.worldName ?? "...").trim() || "...",
      theme:sourceSettings.theme === "light" ? "light" : "dark",
      language:sourceSettings.language === "en" ? "en" : "es",
      editingWorldName:Boolean(sourceSettings.editingWorldName)
    },
    events:[],
    regions:[],
    playerCharacters:[],
    importantNpcs:[],
    relations:{},
    calendar:createDefaultCalendar(),
    log:[]
  };

  const sourceEvents = Array.isArray(source.events) ? source.events : [];
  normalized.events = sourceEvents.map((event,index)=>{
    const milestones = Array.isArray(event?.milestones) ? event.milestones : [];
    const normalizedMilestones = milestones.map(milestone=>{
      if(typeof milestone === "string"){
        return {
          text:milestone,
          done:false,
          currentSituation:"",
          involvedActivities:"",
          availableAdventures:"",
          directorNotes:""
        };
      }
      return {
        text:String(milestone?.text ?? ""),
        done:Boolean(milestone?.done),
        currentSituation:String(milestone?.currentSituation ?? ""),
        involvedActivities:String(milestone?.involvedActivities ?? ""),
        availableAdventures:String(milestone?.availableAdventures ?? ""),
        directorNotes:String(milestone?.directorNotes ?? "")
      };
    });

    return {
      id:String(event?.id ?? `evento-${Date.now()}-${index}`),
      name:String(event?.name ?? "Evento sin título"),
      editingTitle:Boolean(event?.editingTitle),
      status:STATUS.includes(event?.status) ? event.status : "Dormido",
      phase:String(event?.phase ?? ""),
      trigger:String(event?.trigger ?? ""),
      milestones:normalizedMilestones,
      progress:normalizedMilestones.filter(milestone=>milestone.done).length,
      notes:String(event?.notes ?? "")
    };
  });

  const sourceRegions = Array.isArray(source.regions) ? source.regions : [];
  normalized.regions = sourceRegions.map((region,index)=>{
    const politics = region?.politics && typeof region.politics === "object"
      ? region.politics
      : {};

    const cities = (Array.isArray(region?.cities) ? region.cities : []).map((city,cityIndex)=>{
      const ratings = city?.ratings && typeof city.ratings === "object"
        ? city.ratings
        : {};

      return {
        id:String(city?.id ?? `city-${Date.now()}-${index}-${cityIndex}-${Math.random().toString(36).slice(2,8)}`),
        name:String(city?.name ?? `Ciudad ${cityIndex + 1}`),
        editingName:Boolean(city?.editingName),
        state:CITY_STATES.includes(city?.state) ? city.state : "Estable",
        population:String(city?.population ?? ""),
        notes:String(city?.notes ?? ""),
        expanded:Boolean(city?.expanded),
        ratings:{
          security:clampRating(ratings.security ?? 3),
          economy:clampRating(ratings.economy ?? 3),
          corruption:clampRating(ratings.corruption ?? 1),
          legitimacy:clampRating(ratings.legitimacy ?? 3)
        }
      };
    });

    const cityIds = new Set(cities.map(city=>city.id));
    const characters = (Array.isArray(region?.characters) ? region.characters : []).map((character,characterIndex)=>{
      const cityId = String(character?.cityId ?? "");
      return {
        id:String(character?.id ?? `character-${Date.now()}-${index}-${characterIndex}-${Math.random().toString(36).slice(2,8)}`),
        name:String(character?.name ?? `Personaje ${characterIndex + 1}`),
        editingName:Boolean(character?.editingName),
        species:String(character?.species ?? ""),
        role:String(character?.role ?? ""),
        status:CHARACTER_STATES.includes(character?.status) ? character.status : "Activo",
        cityId:cityIds.has(cityId) ? cityId : "",
        notes:String(character?.notes ?? ""),
        expanded:Boolean(character?.expanded)
      };
    });

    return {
      id:String(region?.id ?? `region-${Date.now()}-${index}-${Math.random().toString(36).slice(2,8)}`),
      name:String(region?.name ?? `Región ${index + 1}`),
      editingName:Boolean(region?.editingName),
      diagnosis:String(region?.diagnosis ?? region?.stability ?? "Estable"),
      editingDiagnosis:Boolean(region?.editingDiagnosis),
      stability:REGION_STATUS.includes(region?.stability) ? region.stability : "Estable",
      military:MILITARY.includes(region?.military) ? region.military : "Paz",
      politics:{
        government:clampRating(politics.government ?? 1),
        legitimacy:clampRating(politics.legitimacy ?? 1),
        corruption:clampRating(politics.corruption ?? 1),
        religion:clampRating(politics.religion ?? 1),
        magic:clampRating(politics.magic ?? 1)
      },
      cities,
      characters,
      notes:String(region?.notes ?? "")
    };
  });


  const sourcePlayerCharacters = Array.isArray(source.playerCharacters)
    ? source.playerCharacters
    : [];

  normalized.playerCharacters = sourcePlayerCharacters.map((player,index)=>{
    const abilitiesSource = player?.abilities && typeof player.abilities === "object"
      ? player.abilities
      : {};

    const abilities = {};
    ["str","dex","con","int","wis","cha"].forEach(key=>{
      const entry = abilitiesSource[key] && typeof abilitiesSource[key] === "object"
        ? abilitiesSource[key]
        : {};
      const scoreValue = Number(entry.score);
      abilities[key] = {
        score:Number.isFinite(scoreValue) ? Math.min(30,Math.max(1,Math.round(scoreValue))) : 10,
        proficient:Boolean(entry.proficient)
      };
    });

    const relatedNpcs = (Array.isArray(player?.relatedNpcs) ? player.relatedNpcs : []).map((npc,npcIndex)=>({
      id:String(npc?.id ?? `player-npc-${Date.now()}-${index}-${npcIndex}-${Math.random().toString(36).slice(2,8)}`),
      name:String(npc?.name ?? `NPC ${npcIndex + 1}`),
      editingName:Boolean(npc?.editingName),
      species:String(npc?.species ?? ""),
      role:String(npc?.role ?? ""),
      status:CHARACTER_STATES.includes(npc?.status) ? npc.status : "Activo",
      relationship:String(npc?.relationship ?? ""),
      notes:String(npc?.notes ?? "")
    }));

    return {
      id:String(player?.id ?? `player-${Date.now()}-${index}-${Math.random().toString(36).slice(2,8)}`),
      name:String(player?.name ?? `Personaje jugador ${index + 1}`),
      editingName:Boolean(player?.editingName),
      race:String(player?.race ?? ""),
      className:String(player?.className ?? player?.class ?? ""),
      level:Number.isFinite(Number(player?.level))
        ? Math.min(20,Math.max(1,Math.round(Number(player.level))))
        : 1,
      abilities,
      relatedNpcs,
      cardExpanded:player?.cardExpanded !== false,
      notes:String(player?.notes ?? "")
    };
  });


  const sourceImportantNpcs = Array.isArray(source.importantNpcs) ? source.importantNpcs : [];
  normalized.importantNpcs = sourceImportantNpcs.map((npc,index)=>{
    const abilitySource = npc?.abilities && typeof npc.abilities === "object" ? npc.abilities : {};
    const abilities = {};
    ["str","dex","con","int","wis","cha"].forEach(key=>{
      const score = Number(abilitySource[key]?.score ?? abilitySource[key] ?? 10);
      abilities[key] = {
        score:Number.isFinite(score) ? Math.min(30,Math.max(1,Math.round(score))) : 10,
        save:String(abilitySource[key]?.save ?? "")
      };
    });
    const normalizeFeature=(feature,featureIndex,prefix)=>({
      id:String(feature?.id ?? `${prefix}-${Date.now()}-${index}-${featureIndex}-${Math.random().toString(36).slice(2,8)}`),
      name:String(feature?.name ?? `Nueva ${prefix}`),
      type:String(feature?.type ?? ""),
      activation:String(feature?.activation ?? ""),
      attackBonus:String(feature?.attackBonus ?? ""),
      reach:String(feature?.reach ?? ""),
      damage:String(feature?.damage ?? ""),
      save:String(feature?.save ?? ""),
      recharge:String(feature?.recharge ?? ""),
      description:String(feature?.description ?? ""),
      notes:String(feature?.notes ?? ""),
      expanded:Boolean(feature?.expanded)
    });
    return {
      id:String(npc?.id ?? `important-npc-${Date.now()}-${index}-${Math.random().toString(36).slice(2,8)}`),
      name:String(npc?.name ?? `Personaje del archivo ${index + 1}`),
      editingName:Boolean(npc?.editingName),
      species:String(npc?.species ?? ""),
      alignment:String(npc?.alignment ?? ""),
      role:String(npc?.role ?? ""),
      size:String(npc?.size ?? "Mediano"),
      armorClass:String(npc?.armorClass ?? ""),
      hitPoints:String(npc?.hitPoints ?? ""),
      hitDice:String(npc?.hitDice ?? ""),
      speed:String(npc?.speed ?? ""),
      initiative:String(npc?.initiative ?? ""),
      challengeRating:String(npc?.challengeRating ?? ""),
      proficiencyBonus:String(npc?.proficiencyBonus ?? ""),
      abilities,
      vulnerabilities:String(npc?.vulnerabilities ?? ""),
      resistances:String(npc?.resistances ?? ""),
      immunities:[String(npc?.immunities ?? "").trim(),String(npc?.conditionImmunities ?? "").trim()]
        .filter(Boolean).join("; "),
      conditionImmunities:"",
      skills:String(npc?.skills ?? ""),
      senses:String(npc?.senses ?? ""),
      languages:String(npc?.languages ?? ""),
      traits:(Array.isArray(npc?.traits) ? npc.traits : []).map((f,i)=>normalizeFeature(f,i,"rasgo")),
      actions:(Array.isArray(npc?.actions) ? npc.actions : []).map((f,i)=>normalizeFeature(f,i,"acción")),
      bonusActions:(Array.isArray(npc?.bonusActions) ? npc.bonusActions : []).map((f,i)=>normalizeFeature(f,i,"acción adicional")),
      reactions:(Array.isArray(npc?.reactions) ? npc.reactions : []).map((f,i)=>normalizeFeature(f,i,"reacción")),
      legendaryActions:(Array.isArray(npc?.legendaryActions) ? npc.legendaryActions : []).map((f,i)=>normalizeFeature(f,i,"acción legendaria")),
      lairActions:(Array.isArray(npc?.lairActions) ? npc.lairActions : []).map((f,i)=>normalizeFeature(f,i,"acción de guarida")),
      cardExpanded:npc?.cardExpanded !== false,
      defensesSectionExpanded:npc?.defensesSectionExpanded !== false,
      traitsSectionExpanded:npc?.traitsSectionExpanded !== false,
      actionsSectionExpanded:npc?.actionsSectionExpanded !== false,
      actionSubsectionsExpanded:{
        actions:npc?.actionSubsectionsExpanded?.actions !== false,
        bonusActions:npc?.actionSubsectionsExpanded?.bonusActions !== false,
        reactions:npc?.actionSubsectionsExpanded?.reactions !== false,
        legendaryActions:npc?.actionSubsectionsExpanded?.legendaryActions !== false,
        lairActions:npc?.actionSubsectionsExpanded?.lairActions !== false
      },
      notes:String(npc?.notes ?? "")
    };
  });

  const validRegionIds = new Set(normalized.regions.map(region=>region.id));
  const sourceRelations = source.relations && typeof source.relations === "object" && !Array.isArray(source.relations)
    ? source.relations
    : {};

  Object.entries(sourceRelations).forEach(([key,value])=>{
    const [idA,idB,...extra] = String(key).split("::");
    if(
      extra.length === 0 &&
      idA !== idB &&
      validRegionIds.has(idA) &&
      validRegionIds.has(idB) &&
      RELATION_STATES.includes(value)
    ){
      normalized.relations[relationKey(idA,idB)] = value;
    }
  });

  const sourceCalendar = source.calendar && typeof source.calendar === "object" && !Array.isArray(source.calendar)
    ? source.calendar
    : {};
  const sourceMonths = Array.isArray(sourceCalendar.months) ? sourceCalendar.months : [];
  const monthCount = clampCalendarValue(
    sourceCalendar.monthCount ?? sourceMonths.length,
    1,
    CALENDAR_MAX_MONTHS,
    CALENDAR_DEFAULT_MONTHS
  );
  normalized.calendar = {
    monthCount,
    months:Array.from({length:monthCount},(_,index)=>{
      const month = sourceMonths[index] && typeof sourceMonths[index] === "object"
        ? sourceMonths[index]
        : {};
      const defaultMonth = createCalendarMonth(index);
      return {
        name:String(month.name ?? defaultMonth.name).trim() || defaultMonth.name,
        season:CALENDAR_SEASONS.includes(month.season) ? month.season : defaultMonth.season,
        days:clampCalendarValue(
          month.days ?? sourceCalendar.daysPerMonth,
          1,
          CALENDAR_MAX_DAYS,
          defaultMonth.days
        )
      };
    }),
    selectedDay:null
  };

  const selectedMonth = Number(sourceCalendar.selectedDay?.monthIndex);
  const selectedDay = Number(sourceCalendar.selectedDay?.day);
  if(
    Number.isInteger(selectedMonth) &&
    selectedMonth >= 0 &&
    selectedMonth < monthCount &&
    Number.isInteger(selectedDay) &&
    selectedDay >= 1 &&
    selectedDay <= normalized.calendar.months[selectedMonth].days
  ){
    normalized.calendar.selectedDay = {
      monthIndex:selectedMonth,
      day:selectedDay
    };
  }

  const sourceLog = Array.isArray(source.log) ? source.log : [];
  normalized.log = sourceLog.map((entry,index)=>({
    date:String(entry?.date ?? ""),
    source:String(entry?.source ?? ""),
    text:String(entry?.text ?? ""),
    createdAt:String(entry?.createdAt ?? new Date(Date.now()+index).toISOString())
  }));

  return normalized;
}

function loadState(){

const milestoneDetailUI={};

function getMilestoneDetailUI(eventIndex){
  const event=state.events[eventIndex];
  if(!event || !event.milestones.length){
    milestoneDetailUI[eventIndex]={milestoneIndex:-1,tab:"currentSituation"};
    return milestoneDetailUI[eventIndex];
  }

  const current=milestoneDetailUI[eventIndex] || {
    milestoneIndex:-1,
    tab:"currentSituation"
  };
  const allowedTabs=["currentSituation","involvedActivities","availableAdventures","directorNotes"];
  const tab=allowedTabs.includes(current.tab) ? current.tab : "currentSituation";

  let milestoneIndex=Number.isInteger(current.milestoneIndex)
    ? current.milestoneIndex
    : -1;

  if(milestoneIndex >= event.milestones.length){
    milestoneIndex=event.milestones.length-1;
  }
  if(milestoneIndex < -1){
    milestoneIndex=-1;
  }

  milestoneDetailUI[eventIndex]={milestoneIndex,tab};
  return milestoneDetailUI[eventIndex];
}

function selectMilestoneDetail(eventIndex,milestoneIndex){
  const current=getMilestoneDetailUI(eventIndex);
  const isAlreadySelected=current.milestoneIndex===milestoneIndex;

  milestoneDetailUI[eventIndex]={
    milestoneIndex:isAlreadySelected ? -1 : milestoneIndex,
    tab:current.tab
  };
  renderEvents();
}

function selectMilestoneTab(eventIndex,tab){
  const current=getMilestoneDetailUI(eventIndex);
  milestoneDetailUI[eventIndex]={milestoneIndex:current.milestoneIndex,tab};
  renderEvents();
}

function renderMilestoneDetail(eventIndex){
  const event=state.events[eventIndex];
  const ui=getMilestoneDetailUI(eventIndex);
  if(!event || ui.milestoneIndex<0){
    return "";
  }

  const milestone=event.milestones[ui.milestoneIndex];
  const tabs=[
    ["currentSituation","Situación actual"],
    ["involvedActivities","Actividades"],
    ["availableAdventures","Aventuras"],
    ["directorNotes","Notas del Director"]
  ];
  const labels={
    currentSituation:"Situación actual",
    involvedActivities:"Actividades de los implicados",
    availableAdventures:"Aventuras disponibles",
    directorNotes:"Notas del Director del hito"
  };

  return `
    <div class="milestone-detail">
      <div class="milestone-detail-head">
        <strong>Detalles: ${escapeHtml(milestone.text)}</strong>
        <span class="small">Hito ${ui.milestoneIndex+1} de ${event.milestones.length}</span>
      </div>
      <div class="milestone-tabs" role="tablist">
        ${tabs.map(([key,label])=>`
          <button
            class="milestone-tab ${ui.tab===key ? "active" : ""}"
            type="button"
            role="tab"
            aria-selected="${ui.tab===key}"
            onclick="selectMilestoneTab(${eventIndex},'${key}')">${label}</button>
        `).join("")}
      </div>
      <label>${labels[ui.tab]}</label>
      <textarea
        aria-label="${labels[ui.tab]}"
        placeholder="Escribe aquí..."
        onchange="updateMilestoneField(${eventIndex},${ui.milestoneIndex},'${ui.tab}',this.value)">${escapeHtml(milestone[ui.tab] || "")}</textarea>
    </div>
  `;
}


function getCalendarMonthStart(monthIndex){
  return state.calendar.months
    .slice(0,monthIndex)
    .reduce((total,month)=>total + month.days,0) % 7;
}

function updateCalendarMonthCount(value){
  const nextCount=clampCalendarValue(value,1,CALENDAR_MAX_MONTHS,state.calendar.monthCount);
  const months=state.calendar.months.slice(0,nextCount);
  while(months.length<nextCount){
    months.push(createCalendarMonth(months.length));
  }

  state.calendar.monthCount=nextCount;
  state.calendar.months=months;

  const selected=state.calendar.selectedDay;
  if(selected && selected.monthIndex>=nextCount){
    state.calendar.selectedDay={
      monthIndex:nextCount-1,
      day:Math.min(selected.day,months[nextCount-1].days)
    };
  }

  autoSave();
  renderCalendar();
}

function updateCalendarMonthDays(monthIndex,value){
  const month=state.calendar.months[monthIndex];
  if(!month) return;

  month.days=clampCalendarValue(value,1,CALENDAR_MAX_DAYS,month.days);

  const selected=state.calendar.selectedDay;
  if(selected?.monthIndex===monthIndex && selected.day>month.days){
    state.calendar.selectedDay={
      monthIndex,
      day:month.days
    };
  }

  autoSave();
  renderCalendar();
}

function updateCalendarMonthName(monthIndex,value){
  const clean=String(value ?? "").trim();
  state.calendar.months[monthIndex].name=clean || `Mes ${monthIndex + 1}`;
  autoSave();
}

function updateCalendarSeason(monthIndex,value){
  if(!CALENDAR_SEASONS.includes(value)) return;
  state.calendar.months[monthIndex].season=value;
  autoSave();
}

function selectCalendarDay(monthIndex,day){
  const current=state.calendar.selectedDay;
  const sameDay=current &&
    current.monthIndex===monthIndex &&
    current.day===day;

  state.calendar.selectedDay=sameDay
    ? null
    : {monthIndex,day};

  autoSave();
  renderCalendar();
}

function renderCalendar(){
  const grid=document.getElementById("calendarGrid");
  const controls=document.getElementById("calendarControls");
  if(!grid || !controls) return;

  const selected=state.calendar.selectedDay;

  controls.innerHTML=`
    <label class="calendar-month-count-control" for="calendarMonthCount">
      Meses del año
      <input
        id="calendarMonthCount"
        type="number"
        min="1"
        max="12"
        step="1"
        value="${state.calendar.monthCount}"
        onchange="updateCalendarMonthCount(this.value)">
    </label>
  `;

  const monthCards=state.calendar.months.map((month,monthIndex)=>{
    const startOffset=getCalendarMonthStart(monthIndex);
    const daysInMonth=month.days;
    const spacers=Array.from(
      {length:startOffset},
      ()=>'<div class="calendar-day-spacer" aria-hidden="true"></div>'
    ).join("");
    const days=Array.from({length:daysInMonth},(_,dayIndex)=>{
      const day=dayIndex+1;
      const isSelected=selected?.monthIndex===monthIndex && selected?.day===day;
      return `
        <button
          class="calendar-day ${isSelected ? "selected" : ""}"
          type="button"
          aria-pressed="${isSelected}"
          aria-label="${escapeAttr(month.name)}, día ${day}"
          onclick="selectCalendarDay(${monthIndex},${day})">${day}</button>
      `;
    }).join("");

    return `
      <section class="calendar-month nav-scroll-target" id="calendar-month-${monthIndex + 1}">
        <div class="calendar-month-header">
          <div class="calendar-month-top">
            <input
              class="calendar-month-name"
              value="${escapeAttr(month.name)}"
              aria-label="Nombre del mes ${monthIndex + 1}"
              onchange="updateCalendarMonthName(${monthIndex},this.value)">
            <label class="calendar-days-control">
              <input
                type="number"
                min="1"
                max="31"
                step="1"
                value="${month.days}"
                aria-label="Días de ${escapeAttr(month.name)}"
                onchange="updateCalendarMonthDays(${monthIndex},this.value)">
              días
            </label>
          </div>
          <div class="calendar-month-subrow">
            <select
              class="calendar-season"
              aria-label="Estación de ${escapeAttr(month.name)}"
              onchange="updateCalendarSeason(${monthIndex},this.value)">
              ${CALENDAR_SEASONS.map(season=>`
                <option value="${season}" ${season===month.season ? "selected" : ""}>${season}</option>
              `).join("")}
            </select>
          </div>
        </div>
        <div class="calendar-weekdays" aria-hidden="true">
          ${CALENDAR_WEEKDAYS.map(day=>`<div class="calendar-weekday">${day}</div>`).join("")}
        </div>
        <div class="calendar-days">
          ${spacers}
          ${days}
        </div>
      </section>
    `;
  }).join("");

  grid.innerHTML=monthCards;
  applyLanguage();
}

}

const PLAYER_ABILITY_FIELDS = [
  ["str","FUE"],
  ["dex","DES"],
  ["con","CON"],
  ["int","INT"],
  ["wis","SAB"],
  ["cha","CAR"]
];

function getAbilityModifier(score){
  const value=Number(score);
  return Number.isFinite(value) ? Math.floor((value-10)/2) : 0;
}

function getProficiencyBonus(level){
  const value=Math.min(20,Math.max(1,Math.round(Number(level) || 1)));
  return 2 + Math.floor((value-1)/4);
}

function formatSigned(value){
  const number=Number(value) || 0;
  return number>=0 ? `+${number}` : String(number);
}

function getPassivePerception(player){
  const wisdomModifier=getAbilityModifier(player.abilities.wis.score);
  const proficiency=player.abilities.wis.proficient ? getProficiencyBonus(player.level) : 0;
  return 10 + wisdomModifier + proficiency;
}

  ];

  state.events[eventIndex].milestones.push({
    text:"Nuevo hito",
    done:false,
    currentSituation:"",
    involvedActivities:"",
    availableAdventures:"",
    directorNotes:""
  });
  syncEventProgress(eventIndex);
  milestoneDetailUI[eventIndex]={
    milestoneIndex:state.events[eventIndex].milestones.length-1,
    tab:"currentSituation"
  };
  autoSave();
  renderEvents();

  const inputs = document.querySelectorAll(
    `#eventsGrid .card:nth-child(${eventIndex + 1}) .milestone-row input[type="text"]`

function deleteMilestone(eventIndex, milestoneIndex){
  const milestone = state.events[eventIndex].milestones[milestoneIndex];
  if(!confirm(`¿Eliminar el hito "${milestone.text}"?`)) return;
  state.events[eventIndex].milestones.splice(milestoneIndex,1);
  const current=milestoneDetailUI[eventIndex];
  if(current){
    if(current.milestoneIndex===milestoneIndex){
      current.milestoneIndex=Math.max(0,milestoneIndex-1);
    }else if(current.milestoneIndex>milestoneIndex){
      current.milestoneIndex--;
    }
  }
  syncEventProgress(eventIndex);
  autoSave();
  renderEvents();
}

function formatWorldNameForFilename(value){
  const clean = String(value ?? "Mundo")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .replace(/\s+/g,"-")
    .replace(/[^A-Za-z0-9-]/g,"")
    .replace(/-+/g,"-")
    .replace(/^-+|-+$/g,"");

  if(!clean) return "Mundo";
  return clean.charAt(0).toUpperCase()+clean.slice(1);
}

function formatSaveDate(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const yyyy=String(d.getFullYear());
  return `${dd}-${mm}-${yyyy}`;
}

function exportState(){
  if(document.activeElement?.id === "worldNameInput"){
    saveWorldName(document.activeElement.value);
  }else if(document.activeElement && typeof document.activeElement.blur === "function"){
    document.activeElement.blur();
  }

  syncPreferencesToState();
  const completeState = normalizeState(structuredClone(state));
  state = completeState;
  autoSave();

  const exportedWorld=ArchivoRolJSON.tag({
    ...completeState,
    _worldFile:{id:activeWorldId,version:1}
  },WORLD_JSON_DESCRIPTOR);
  const blob = new Blob(
    [JSON.stringify(exportedWorld,null,2)],
    {type:"application/json;charset=utf-8"}
  );
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${formatWorldNameForFilename(completeState.settings.worldName)}-${formatSaveDate()}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
}

function chooseImportConflict(kind,name,language='es'){
  let overlay=document.getElementById('importConflictOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='importConflictOverlay';
    overlay.className='import-conflict-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-hidden','true');
    overlay.innerHTML=`<div class="import-conflict-dialog"><div class="import-conflict-heading"><span class="import-conflict-symbol" aria-hidden="true">!</span><div><h3 data-role="title"></h3></div></div><p class="import-conflict-message" data-role="message"></p><div class="import-conflict-actions"><button type="button" data-choice="cancel"></button><button type="button" class="import-conflict-copy" data-choice="copy"></button><button type="button" class="primary" data-choice="update"></button></div></div>`;
    document.body.appendChild(overlay);
  }
  const english=language==='en';
  overlay.querySelector('[data-role="title"]').textContent=english?'Import conflict':'Conflicto de importación';
  overlay.querySelector('[data-role="message"]').textContent=english
    ?`The ${kind==='world'?'world':'character'} "${name}" already exists, but the imported file contains changes. What would you like to do?`
    :`El ${kind==='world'?'mundo':'personaje'} "${name}" ya existe, pero el archivo importado contiene cambios. ¿Qué quieres hacer?`;
  overlay.querySelector('[data-choice="cancel"]').textContent=english?'Cancel':'Cancelar';
  overlay.querySelector('[data-choice="copy"]').textContent=english?'Create new entry':'Crear nueva entrada';
  overlay.querySelector('[data-choice="update"]').textContent=english?'Update local copy':'Actualizar copia local';
  return new Promise(resolve=>{
    let settled=false;
    const finish=choice=>{
      if(settled)return;
      settled=true;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      document.removeEventListener('keydown',handleKey);
      resolve(choice);
    };
    const handleKey=event=>{if(event.key==='Escape')finish('cancel')};
    overlay.querySelectorAll('[data-choice]').forEach(button=>{button.onclick=()=>finish(button.dataset.choice)});
    overlay.onclick=event=>{if(event.target===overlay)finish('cancel')};
    document.addEventListener('keydown',handleKey);
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>overlay.querySelector('[data-choice="update"]')?.focus());
  });
}function importState(event){
  const input = event.target;
  const file = input.files?.[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload=async()=>{
    try{
      const importedDocument = JSON.parse(String(reader.result ?? ""));
      const {data:imported}=ArchivoRolJSON.read(importedDocument,WORLD_JSON_DESCRIPTOR);
      const importedState = normalizeState(imported?.world ?? imported?.state ?? imported);
      const importedId = String(imported?._worldFile?.id ?? imported?.worldId ?? "");
      const importedSignature = JSON.stringify(importedState);
      autoSave();

      const matchingWorld=importedId
        ?worldLibrary.worlds.find(world=>world.id===importedId)
        :null;
      if(matchingWorld){
        const localSignature=JSON.stringify(normalizeState(structuredClone(matchingWorld.state)));
        if(localSignature===importedSignature){
          alert(currentLanguage === "en" ? "This world is already up to date." : "Este mundo ya está actualizado.");
          return;
        }
        const importedName=importedState.settings.worldName || (currentLanguage==="en"?"Untitled world":"Mundo sin nombre");
        const choice=await chooseImportConflict("world",importedName,currentLanguage);
        if(choice==="copy"){
          const copyId=createWorldFileId();
          worldLibrary.worlds.push({id:copyId,state:importedState});
          activeWorldId=copyId;
          worldLibrary.activeId=copyId;
          state=importedState;
          state.settings.theme=currentTheme;
          currentLanguage=state.settings.language;
          resetActiveWorldUndoTracking(true);
          localStorage.setItem(WORLDBUILDING_THEME_KEY,currentTheme);
          localStorage.setItem(WORLDBUILDING_LANGUAGE_KEY,currentLanguage);
          persistWorldLibrary();
          render();
          updateFloatingNavActive();
          alert(currentLanguage === "en" ? "World imported as a new entry." : "Mundo importado como una nueva entrada.");
          return;
        }
        if(choice!=="update") return;
        matchingWorld.state=importedState;
        activeWorldId=matchingWorld.id;
        worldLibrary.activeId=matchingWorld.id;
        state=importedState;
        state.settings.theme=currentTheme;
        currentLanguage=state.settings.language;
        resetActiveWorldUndoTracking(true);
        localStorage.setItem(WORLDBUILDING_THEME_KEY,currentTheme);
        localStorage.setItem(WORLDBUILDING_LANGUAGE_KEY,currentLanguage);
        persistWorldLibrary();
        render();
        updateFloatingNavActive();
        alert(currentLanguage === "en" ? "World updated successfully." : "Mundo actualizado correctamente.");
        return;
      }

      const sameContents=worldLibrary.worlds.some(world=>
        JSON.stringify(normalizeState(structuredClone(world.state)))===importedSignature
      );
      if(sameContents){
        alert(currentLanguage === "en" ? "This world is already in the library." : "Este mundo ya está en la biblioteca.");
        return;
      }

      const id=importedId || createWorldFileId();
      worldLibrary.worlds.push({id,state:importedState});
      activeWorldId=id;
      worldLibrary.activeId=id;
      state=importedState;
      state.settings.theme=currentTheme;
      currentLanguage=state.settings.language;
      resetActiveWorldUndoTracking(true);
      localStorage.setItem(WORLDBUILDING_THEME_KEY,currentTheme);
      localStorage.setItem(WORLDBUILDING_LANGUAGE_KEY,currentLanguage);
      persistWorldLibrary();
      render();
      updateFloatingNavActive();
      alert(currentLanguage === "en" ? "World added successfully." : "Mundo añadido correctamente.");
    }catch(error){
      if(error?.code==="INCOMPATIBLE_DOCUMENT"||error?.code==="INCOMPATIBLE_APPLICATION"){
        alert(currentLanguage === "en" ? "This JSON file belongs to another tool or game system." : "Este archivo JSON pertenece a otra herramienta o sistema de juego.");
      }else if(error?.code==="UNSUPPORTED_FORMAT_VERSION"){
        alert(currentLanguage === "en" ? "This file was created with a newer version of Quibbol’s RPG Toolkit." : "Este archivo fue creado con una versión más reciente de Quibbol’s RPG Toolkit.");
      }else{
        alert(currentLanguage === "en" ? "The JSON file is invalid or does not contain a compatible world." : "El archivo JSON no es válido o no contiene un mundo compatible.");
      }
    }finally{
      input.value = "";
    }
  };
  reader.onerror=()=>{
    input.value = "";
    alert(currentLanguage === "en" ? "The JSON file could not be read." : "No se pudo leer el archivo JSON.");
  };
  reader.readAsText(file);
}

  const feature=state.importantNpcs?.[npcIndex]?.[section]?.[featureIndex];
  if(!feature) return;
  feature.expanded=!feature.expanded;
  autoSave();
  renderImportantNpcs();
}
function deleteImportantNpcFeature(npcIndex,section,featureIndex){
  const list=state.importantNpcs?.[npcIndex]?.[section];
  if(!list) return;
  list.splice(featureIndex,1);
  autoSave();
  renderImportantNpcs();
}
function importantNpcFeatureMeta(feature){
  return [
    feature.type,
    feature.activation,
    feature.attackBonus ? `Ataque ${feature.attackBonus}` : "",
    feature.save,
    feature.recharge
  ].filter(Boolean).join(" • ") || "Sin detalles";
}
function renderImportantNpcFeature(npcIndex,section,feature,featureIndex){
  const isTrait=section==="traits";
  return `
    <div class="npc-feature-card ${isTrait ? "npc-trait-card" : ""}">
      <div class="npc-feature-summary">
        <div class="npc-feature-summary-main">
          <button class="npc-feature-toggle" type="button"
            onclick="toggleImportantNpcFeature(${npcIndex},'${section}',${featureIndex})"
            aria-expanded="${feature.expanded}">
            ${feature.expanded?"▴":"▾"}
          </button>
          <div style="min-width:0">
            <div class="npc-feature-title">${escapeHtml(feature.name)}</div>
            ${isTrait ? "" : `<div class="npc-feature-meta">${escapeHtml(importantNpcFeatureMeta(feature))}</div>`}
          </div>
        </div>
        <div class="npc-feature-actions">
          ${isTrait ? "" : `
            <div class="npc-feature-order">
              <button class="square-button" type="button"
                onclick="moveImportantNpcFeature(${npcIndex},'${section}',${featureIndex},-1)"
                title="Mover arriba"
                ${featureIndex===0 ? "disabled" : ""}>↑</button>
              <button class="square-button" type="button"
                onclick="moveImportantNpcFeature(${npcIndex},'${section}',${featureIndex},1)"
                title="Mover abajo"
                ${featureIndex===state.importantNpcs[npcIndex][section].length-1 ? "disabled" : ""}>↓</button>
            </div>
          `}
          <button class="danger square-button" type="button"
            onclick="deleteImportantNpcFeature(${npcIndex},'${section}',${featureIndex})"
            title="Eliminar">×</button>
        </div>
      </div>
      ${feature.expanded ? `
        <div class="npc-feature-body">
          ${isTrait ? `
            <div>
              <label>Nombre</label>
              <input value="${escapeAttr(feature.name)}"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'name',this.value);renderImportantNpcs()">
            </div>
            <label>Descripción</label>
            <textarea onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'description',this.value)">${escapeHtml(feature.description)}</textarea>
          ` : `
            <div class="npc-feature-fields">
              <div><label>Nombre</label><input value="${escapeAttr(feature.name)}"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'name',this.value);renderImportantNpcs()"></div>
              <div><label>Tipo</label><input value="${escapeAttr(feature.type)}" placeholder="Cuerpo a cuerpo, pasivo..."
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'type',this.value)"></div>
              <div><label>Activación</label><input value="${escapeAttr(feature.activation)}" placeholder="Acción, reacción..."
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'activation',this.value)"></div>
              <div><label>Bonificador al ataque</label><input value="${escapeAttr(feature.attackBonus)}" placeholder="+7"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'attackBonus',this.value)"></div>
              <div><label>Alcance</label><input value="${escapeAttr(feature.reach)}" placeholder="1,5 m / 18 m"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'reach',this.value)"></div>
              <div><label>Daño</label><input value="${escapeAttr(feature.damage)}" placeholder="2d8+4 cortante"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'damage',this.value)"></div>
              <div><label>Salvación</label><input value="${escapeAttr(feature.save)}" placeholder="DES CD 15"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'save',this.value)"></div>
              <div><label>Recarga o usos</label><input value="${escapeAttr(feature.recharge)}" placeholder="Recarga 5–6 / 3 al día"
                onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'recharge',this.value)"></div>
            </div>
            <label>Descripción</label>
            <textarea onchange="updateImportantNpcFeature(${npcIndex},'${section}',${featureIndex},'description',this.value)">${escapeHtml(feature.description)}</textarea>
          `}
        </div>` : ""}
    </div>`;
}

function toggleImportantNpcSection(npcIndex,sectionKey){
  const npc=state.importantNpcs?.[npcIndex];
  if(!npc) return;
  npc[sectionKey]=!npc[sectionKey];
  autoSave();
  renderImportantNpcs();
}

function renderImportantNpcs(){

      <div class="npc-identity-grid">
        <div><label>Especie o tipo</label><input value="${escapeAttr(npc.species)}" placeholder="Humanoide, infernal..."

        <div><label>Rol</label><input value="${escapeAttr(npc.role)}" placeholder="Villano, aliado..."
          onchange="updateImportantNpc(${npcIndex},'role',this.value)"></div>
        <div><label>Tamaño</label><input value="${escapeAttr(npc.size)}"
          onchange="updateImportantNpc(${npcIndex},'size',this.value)"></div>
        <div><label>Alineamiento</label><input value="${escapeAttr(npc.alignment)}" placeholder="Legal malvado..."

        <div><label>Dados de golpe</label><input value="${escapeAttr(npc.hitDice)}" placeholder="18d10+90"

        <div><label>PG</label><input value="${escapeAttr(npc.hitPoints)}" placeholder="199"
          onchange="updateImportantNpc(${npcIndex},'hitPoints',this.value)"></div>
      </div>

      <div class="npc-section">
        <div class="npc-core-stats">
          ${[
            ["armorClass","CA",npc.armorClass,"18"],
            ["hitPoints","PG",npc.hitPoints,"199"],
            ["speed","Velocidad",npc.speed,"9 m, vuelo 18 m"],
            ["initiative","Iniciativa",npc.initiative,"+7"],
            ["challengeRating","CR",npc.challengeRating,"11"],
            ["proficiencyBonus","BC",npc.proficiencyBonus,"+4"]
          ].map(([key,label,value,placeholder])=>`
            <div class="npc-core-stat"><label>${label}</label>
              <input value="${escapeAttr(value)}" placeholder="${placeholder}"
                onchange="updateImportantNpc(${npcIndex},'${key}',this.value)">
            </div>`).join("")}
        </div>
      </div>

      <div class="npc-section">
        <h4>Características y salvaciones</h4>
        <div class="npc-abilities-horizontal">
          ${IMPORTANT_NPC_ABILITY_FIELDS.map(([key,label])=>`
            <div class="npc-ability-cell">
              <strong>${label}</strong>
              <input type="number" min="1" max="30" value="${npc.abilities[key].score}"
                title="Puntuación"
                onchange="updateImportantNpcAbility(${npcIndex},'${key}','score',this.value)">
              <div class="npc-ability-mod">${signedNpcNumber(npcAbilityModifier(npc.abilities[key].score))}</div>
              <input value="${escapeAttr(npc.abilities[key].save)}" placeholder="Salv."
                title="Bonificador de salvación"
                onchange="updateImportantNpcAbility(${npcIndex},'${key}','save',this.value)">

      </div>

      <div class="npc-section">
        <div class="npc-section-titlebar">
          <h3>Defensas, sentidos, idiomas y habilidades</h3>
          <button class="square-button" type="button"

          <div class="npc-defense-grid" style="margin-top:8px">
          <div class="npc-skills-field">
            <label>Habilidades</label>
            <textarea
              placeholder="Ej. Percepción +7, Sigilo +5, Persuasión +6..."
              onchange="updateImportantNpc(${npcIndex},'skills',this.value)">${escapeHtml(npc.skills)}</textarea>
          </div>
          <div><label>Vulnerabilidades</label><input value="${escapeAttr(npc.vulnerabilities)}"
            onchange="updateImportantNpc(${npcIndex},'vulnerabilities',this.value)"></div>
          <div><label>Resistencias</label><input value="${escapeAttr(npc.resistances)}"
            onchange="updateImportantNpc(${npcIndex},'resistances',this.value)"></div>
          <div><label>Inmunidades</label><input value="${escapeAttr(npc.immunities)}"

          <div><label>Sentidos</label><input value="${escapeAttr(npc.senses)}" placeholder="Visión en la oscuridad 36 m..."
            onchange="updateImportantNpc(${npcIndex},'senses',this.value)"></div>

            onchange="updateImportantNpc(${npcIndex},'languages',this.value)"></div>

        ` : ""}
      </div>

      <div class="npc-section">
        <div class="npc-section-titlebar">
          <h3>Rasgos${npc.traits.length ? ` · ${npc.traits.length}` : ""}</h3>

      <div class="npc-section">

          <button class="square-button" type="button"
            onclick="toggleImportantNpcSection(${npcIndex},'actionsSectionExpanded')"

          </button>

        ${npc.actionsSectionExpanded ? `
          ${[
            ["actions","Acciones"],
            ["bonusActions","Acciones adicionales"],
            ["reactions","Reacciones"],
            ["legendaryActions","Acciones legendarias"],
            ["lairActions","Acciones de guarida"]

                <button class="npc-subsection-toggle" type="button"
                  onclick="toggleImportantNpcActionSubsection(${npcIndex},'${section}')"
                  aria-expanded="${subsectionOpen}"
                  title="${subsectionOpen ? "Contraer subsección" : "Expandir subsección"}">
                  ${subsectionOpen ? "▴" : "▾"}
                </button>
              </div>
              ${subsectionOpen ? `
                <div class="npc-section-inline-actions">
                  <button type="button"
                    onclick="addImportantNpcFeature(${npcIndex},'${section}','${label.replace(/es$/,"").replace(/s$/,"")}')">
                    + Añadir
                  </button>
                </div>
                <div class="npc-feature-list">
                  ${npc[section].length
                    ? npc[section].map((feature,featureIndex)=>renderImportantNpcFeature(npcIndex,section,feature,featureIndex)).join("")

function toggleNpcCodexPanel(force){
  const overlay=document.getElementById("npcCodexOverlay");
  const button=document.getElementById("npcCodexButton");
  if(!overlay || !button) return;
  const open=typeof force==="boolean" ? force : !overlay.classList.contains("open");
  if(open){
    togglePlayerPanel(false);
    toggleNotesPanel(false);
  }
  overlay.classList.toggle("open",open);
  button.classList.toggle("open",open);
  document.body.classList.toggle("npc-codex-open",open);
  button.textContent=open ? "✕" : "♜";
  button.title=open ? "Cerrar Archivo de Personajes" : "Abrir Archivo de Personajes";
  button.setAttribute("aria-label",button.title);
  button.setAttribute("aria-expanded",String(open));
}

function syncSharedTheme(){
  const sharedTheme=readThemePreference(currentTheme);
  if(sharedTheme===currentTheme)return;
  writeThemePreference(sharedTheme);
  currentTheme=sharedTheme;
  state.settings.theme=currentTheme;
  localStorage.setItem(WORLDBUILDING_THEME_KEY,currentTheme);
  persistWorldLibrary();
  applyTheme();
}
window.addEventListener("pageshow",syncSharedTheme);
window.addEventListener("storage",event=>{if(event.key===SHARED_THEME_KEY)syncSharedTheme()});
document.addEventListener("keydown",event=>{
  if(!(event.ctrlKey||event.metaKey) || event.shiftKey || event.key.toLowerCase()!=="z") return;
  if(document.querySelector(".import-conflict-overlay.open")) return;
  const target=event.target;
  if(target instanceof HTMLElement && (target.matches("input,textarea,[contenteditable='true']") || target.isContentEditable)) return;
  event.preventDefault();
  undoLastWorldChange();
});
render();
</script>

  if(open){ toggleNotesPanel(false); toggleNpcCodexPanel(false); }

function toggleNotesPanel(force){

  button.setAttribute('aria-label',open ? 'Cerrar notas' : 'Abrir notas');
  button.setAttribute('aria-expanded',String(open));
}
</script>


<script>
(function initSafeSidePanelOutsideClicks(){
  function bindSafeOutsideClose(overlayId, panelSelector, closePanel){
    const overlay = document.getElementById(overlayId);
    const panel = overlay ? overlay.querySelector(panelSelector) : null;

    if (!overlay || !panel || overlay.dataset.safeOutsideClose === "true") return;

    overlay.dataset.safeOutsideClose = "true";
    let interactionStartedOutside = false;

    overlay.addEventListener("pointerdown", function(event){
      interactionStartedOutside = event.target === overlay;
    }, true);

    overlay.addEventListener("pointercancel", function(){
      interactionStartedOutside = false;
    }, true);

    overlay.addEventListener("click", function(event){
      const interactionEndedOutside = event.target === overlay;

      if (interactionStartedOutside && interactionEndedOutside) {
        closePanel();
      }

      interactionStartedOutside = false;
    });
  }

  bindSafeOutsideClose(
    "playerOverlay",
    ".player-panel",
    function(){ togglePlayerPanel(false); }
  );

  bindSafeOutsideClose(
    "npcCodexOverlay",
    ".npc-codex-panel",
    function(){ toggleNpcCodexPanel(false); }
  );

  bindSafeOutsideClose(
    "notesOverlay",
    ".notes-panel",
    function(){ toggleNotesPanel(false); }
  );
})();
</script>
