function ch(){const c=state.characters.find(c=>c.id===state.activeId)||state.characters[0];if(c&&typeof c.shieldEquipped!=='boolean')c.shieldEquipped=false;if(c&&!Number.isFinite(Number(c.shield)))c.shield=0;if(c&&Array.isArray(c.spells))c.spells.forEach(spell=>{if(typeof spell.prepared!=='boolean')spell.prepared=false});return c}

function renderSelect(){const el=document.getElementById('characterSelect');el.innerHTML=state.characters.map(c=>`<option value="${c.id}" ${c.id===state.activeId?'selected':''}>${esc(c.name||'Sin nombre')}</option>`).join('')}
function renderHead(c){return `<div class="sheet-head"><div class="identity"><div class="identity-grid"><div class="identity-name"><label>Nombre del personaje</label><input class="name-input" value="${attr(c.name)}" onchange="set('name',this.value,true)"></div><div><label>Clase</label><input value="${attr(c.className)}" onchange="set('className',this.value)"></div><div><label>Subclase</label><input value="${attr(c.subclass)}" onchange="set('subclass',this.value)"></div><div><label>Nivel</label><input type="number" min="1" max="20" value="${c.level}" onchange="setNum('level',this.value,1,20,true)"></div><div><label>Especie</label><input value="${attr(c.species)}" onchange="set('species',this.value)"></div><div><label>Trasfondo</label><input value="${attr(c.background)}" onchange="set('background',this.value)"></div><div><label>Alineamiento</label><input value="${attr(c.alignment)}" onchange="set('alignment',this.value)"></div><div><label>PX</label><input type="number" min="0" value="${c.xp}" onchange="setNum('xp',this.value,0)"></div></div><div class="stats-strip"><div class="stat-box"><div class="shield-label-row"><label>Inspiración heroica</label></div><div class="shield-dot-wrap"><button type="button" class="dot ${c.heroic?'active':''}" onclick="toggle('heroic')" aria-label="Inspiración heroica"></button></div></div><div class="stat-box"><label>Competencia</label><div class="stat-value">${signed(prof())}</div></div><div class="stat-box"><label>Iniciativa</label><div class="stat-value">${signed(initiative())}</div></div><div class="stat-box"><label>CA</label><input class="armor-class-input" type="number" value="${totalArmorClass()}" onchange="setTotalArmorClass(this.value)"></div><div class="stat-box"><div class="shield-label-row"><label>Escudo</label><span class="shield-inline-stepper"><button type="button" class="shield-arrow" onclick="changeShieldBonus(1)" aria-label="Aumentar bonificador adicional del escudo">▲</button><span class="shield-extra">${Number(c.shield)>0?'+'+Number(c.shield):''}</span><button type="button" class="shield-arrow" onclick="changeShieldBonus(-1)" ${Number(c.shield)<=0?'disabled':''} aria-label="Reducir bonificador adicional del escudo">▼</button></span></div><div class="shield-dot-wrap"><button type="button" class="dot ${c.shieldEquipped?'active':''}" onclick="toggle('shieldEquipped')" aria-label="Equipar o desequipar escudo"></button></div></div><div class="stat-box"><label>Velocidad</label><textarea rows="1" style="resize:none;min-height:38px;height:38px;text-align:center;overflow:hidden" onchange="set('speed',this.value)">${esc(c.speed)}</textarea></div><div class="stat-box"><label>Tamaño</label><input value="${attr(c.size)}" onchange="set('size',this.value)"></div><div class="stat-box"><label>Percepción pasiva</label><div class="stat-value">${passive()}</div></div></div></div>${renderCombatStatus(c)}</div>`}
function renderCombatStatus(c){return `<aside class="combat-status"><h3>Estado del personaje</h3><div class="combat-status-hp"><label>Puntos de golpe</label><div class="hp-main">${c.hp.current} / ${c.hp.max}</div></div><div class="combat-status-grid"><div class="combat-status-box"><label>PG adicionales</label><div class="combat-status-value">${c.hp.temp}</div></div><div class="combat-status-box"><label>Dados de golpe</label><div class="combat-status-value">${c.hitDice.current} / ${c.hitDice.max} ${esc(c.hitDice.die)}</div></div></div><div class="combat-status-death"><label>Salvaciones contra muerte</label><div class="combat-status-death-grid"><div class="death-row"><span class="small">Éxitos</span><div class="death-dots">${renderDeathDots('success',c.death.success)}</div></div><div class="death-row"><span class="small">Fallos</span><div class="death-dots">${renderDeathDots('fail',c.death.fail)}</div></div></div></div></aside>`}
function renderTabs(){return `<nav class="tabs">${[['principal','Principal'],['combate','Rasgos y condiciones'],['equipo','Equipo'],['conjuros','Conjuros'],['historia','Historia y notas']].map(([id,l])=>`<button class="tab ${activeTab===id?'active':''}" onclick="activeTab='${id}';render()">${l}</button>`).join('')}</nav>`}
function renderWeaponsCard(c){return `<div class="card main-weapons-card"><div class="card-head"><h3>Armas y trucos de daño</h3><div class="weapon-card-actions"><button onclick="toggleWeaponPicker()">Seleccionar arma</button><button onclick="addWeapon()">+ Añadir manual</button></div></div><div class="weapon-picker ${weaponPickerOpen?'open':''}">${Object.entries(WEAPONS_2024).map(([group,names])=>`<div class="weapon-picker-group"><div class="weapon-picker-title">${group}</div><div class="weapon-tags">${names.map(name=>`<button type="button" class="weapon-tag" onclick="addWeaponFromCatalog('${name.replace(/'/g,"\\'")}')">${name}</button>`).join('')}</div></div>`).join('')}</div><div class="table-wrap"><table><colgroup><col style='width:21%'><col style='width:12%'><col style='width:13%'><col style='width:10%'><col style='width:36%'><col style='width:8%'></colgroup><thead><tr><th>Nombre</th><th>Bonif. ataque/CD</th><th>Daño y tipo</th><th>Alcance</th><th>Notas</th><th></th></tr></thead><tbody>${c.weapons.map((w,i)=>`<tr><td><input value="${attr(w.name)}" onchange="updateWeaponField(${i},'name',this.value)"></td><td><input value="${attr(w.attack)}" onchange="updateWeaponField(${i},'attack',this.value)"></td><td><input class="weapon-damage-input" value="${attr(w.damage)}" onchange="updateWeaponField(${i},'damage',this.value)"></td><td><input value="${attr(w.range)}" onchange="updateWeaponField(${i},'range',this.value)"></td><td><input value="${attr(w.notes)}" onchange="updateWeaponField(${i},'notes',this.value)"></td><td><div class="weapon-row-actions"><button class="mini" onclick="moveWeapon(${i},-1)" ${i===0?'disabled':''} title="Subir">↑</button><button class="mini" onclick="moveWeapon(${i},1)" ${i===c.weapons.length-1?'disabled':''} title="Bajar">↓</button><button class="mini danger" onclick="removeList('weapons',${i})" title="Eliminar">×</button></div></td></tr>`).join('')}</tbody></table></div>${c.weapons.length?'':'<div class="empty">No hay armas o trucos registrados.</div>'}</div>`}
function renderMain(c){return `<div class="layout"><div class="stack"><div class="card"><h3>Características y habilidades</h3><div class="abilities">${['str','wis','dex','int','con','cha'].map(k=>renderAbility(c,k,ABILITIES[k][0],ABILITIES[k][1])).join('')}</div></div></div><div class="stack">${renderWeaponsCard(c)}<div class="main-training-resources"><div class="card training-card"><h3>Entrenamiento y competencias con equipo</h3><div class="training-columns"><div class="training-section"><label>Armaduras y escudos</label><div class="armor-checks">${['Ligeras','Medias','Pesadas','Escudos'].map(x=>`<div class="dot-option" role="button" tabindex="0" onclick="toggleArmorTraining('${x}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleArmorTraining('${x}')}"><button type="button" class="dot ${armorTrainingList(c).includes(x)?'active':''}" tabindex="-1" aria-label="${x}"></button><span>${x}</span></div>`).join('')}</div></div><div class="training-section"><label>Armas</label>${renderTrainingSummary([...weaponCategoryList(c),...weaponTrainingList(c)],'weapon')}<div class="training-collapses weapon-collapses">${renderTrainingCollapse('weapon-Simples','Armas simples',[...WEAPONS_2024['Simples cuerpo a cuerpo'],...WEAPONS_2024['Simples a distancia']],weaponTrainingList(c),'weapon','Simples')}${renderTrainingCollapse('weapon-Marciales','Armas marciales',[...WEAPONS_2024['Marciales cuerpo a cuerpo'],...WEAPONS_2024['Marciales a distancia']],weaponTrainingList(c),'weapon','Marciales')}</div></div><div class="training-section"><label>Herramientas</label>${renderTrainingSummary(toolTrainingList(c),'tool')}<div class="training-collapses">${Object.entries(TOOLS_2024).map(([group,tools])=>renderTrainingCollapse('tool-'+group,group,tools,toolTrainingList(c),'tool')).join('')}</div></div><div class="training-section"><label>Idiomas</label>${renderTrainingSummary(languageTrainingList(c),'language')}<div class="training-collapses">${Object.entries(LANGUAGES_2024).map(([group,languages])=>renderTrainingCollapse('language-'+group,group,languages,languageTrainingList(c),'language')).join('')}</div></div></div></div><div class="card"><div class="card-head"><h3>Recursos</h3><button onclick="addResource()">+ Añadir</button></div><div class="list">${c.resources.length?c.resources.map((r,i)=>renderResource(r,i)).join(''):'<div class="empty">Añade recursos de clase, dotes u objetos.</div>'}</div></div></div></div></div>`}
function renderDeathDots(type,value){return Array.from({length:3},(_,i)=>`<button type="button" class="death-dot ${i<value?'active':''}" aria-label="${type==='success'?'Éxito':'Fallo'} ${i+1}" onclick="setDeathSave('${type}',${i+1})"></button>`).join('')}
function renderAbility(c,k,label,skills){const a=c.abilities[k];return `<div class="ability"><div class="ability-title"><strong>${label}</strong><span class="small">Salv. ${signed(saveBonus(k))}</span></div><div class="ability-score"><input type="number" min="1" max="30" value="${a.score}" onchange="setNum('abilities.${k}.score',this.value,1,30,true)"><div class="modifier">${signed(mod(a.score))}</div></div><div class="skill"><button class="${a.save?'active':''}" onclick="toggle('abilities.${k}.save')"></button><span>Tirada de salvación</span><span>${signed(saveBonus(k))}</span></div>${skills.map(s=>`<div class="skill"><button class="${c.skills[s].rank?'active':''}" onclick="cycleSkill('${s.replace(/'/g,"\\'")}')"></button><span>${s}${c.skills[s].rank===2?' (pericia)':''}</span><span>${signed(skillBonus(s))}</span></div>`).join('')}</div>`}
function renderCombat(c){return `<div class="stack"><div class="card"><h3>Condiciones</h3><div class="conditions">${CONDITIONS.map(x=>`<button class="condition ${c.conditions.includes(x)?'active':''}" onclick="toggleCondition('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div></div><div class="card"><div class="card-head"><h3>Rasgos de clase, especie y dotes</h3><button onclick="addTrait()">+ Añadir</button></div><div class="list">${c.traits.length?c.traits.map((t,i)=>renderTrait(t,i)).join(''):'<div class="empty">No hay rasgos registrados.</div>'}</div></div></div>`}
function renderEquipment(c){const weight=c.inventory.reduce((s,x)=>s+(Number(x.weight)||0)*(Number(x.qty)||0),0);return `<div class="stack"><div class="card"><div class="card-head"><h3>Inventario <span class="small">Peso total: ${weight.toFixed(1)}</span></h3><button onclick="addItem()">+ Añadir</button></div><div class="table-wrap"><table><thead><tr><th>Objeto</th><th>Cantidad</th><th>Peso/u.</th><th>Equipado</th><th>Notas</th><th></th></tr></thead><tbody>${c.inventory.map((x,i)=>`<tr><td><input value="${attr(x.name)}" onchange="updateList('inventory',${i},'name',this.value)"></td><td><input type="number" min="0" value="${x.qty}" onchange="updateList('inventory',${i},'qty',Number(this.value),true)"></td><td><input type="number" min="0" step="0.1" value="${x.weight}" onchange="updateList('inventory',${i},'weight',Number(this.value),true)"></td><td><input class="check" type="checkbox" ${x.equipped?'checked':''} onchange="updateList('inventory',${i},'equipped',this.checked)"></td><td><input value="${attr(x.notes)}" onchange="updateList('inventory',${i},'notes',this.value)"></td><td><div class="weapon-row-actions"><button class="mini" onclick="moveListItem('inventory',${i},-1)" ${i===0?'disabled':''} title="Subir objeto">↑</button><button class="mini" onclick="moveListItem('inventory',${i},1)" ${i===c.inventory.length-1?'disabled':''} title="Bajar objeto">↓</button><button class="mini danger" onclick="removeList('inventory',${i})" title="Eliminar objeto">×</button></div></td></tr>`).join('')}</tbody></table></div>${c.inventory.length?'':'<div class="empty">No hay objetos registrados.</div>'}</div><div class="grid2"><div class="card"><h3>Monedas</h3><div class="grid3">${Object.entries(c.coins).map(([k,v])=>`<div><label>${k.toUpperCase()}</label><input type="number" min="0" value="${v}" onchange="setNum('coins.${k}',this.value,0)"></div>`).join('')}</div></div><div class="card"><h3>Sintonización con objetos mágicos</h3>${c.attunement.map((x,i)=>`<input style="margin-bottom:8px" value="${attr(x)}" placeholder="Objeto ${i+1}" onchange="ch().attunement[${i}]=this.value;autoSave()">`).join('')}</div></div></div>`}
function renderSpells(c){return `<div class="layout"><div class="stack"><div class="card"><h3>Aptitud mágica</h3><label>Característica</label><select onchange="set('spellcasting.ability',this.value,true)">${['int','wis','cha'].map(k=>`<option value="${k}" ${c.spellcasting.ability===k?'selected':''}>${ABILITIES[k][0]}</option>`).join('')}</select><div class="stats-strip" style="grid-template-columns:repeat(3,1fr)"><div class="stat-box"><label>Modificador</label><div class="stat-value">${signed(spellMod())}</div></div><div class="stat-box"><label>CD conjuros</label><div class="stat-value">${spellDC()}</div></div><div class="stat-box"><label>Ataque</label><div class="stat-value">${signed(spellAttack())}</div></div></div></div><div class="card"><h3>Espacios de conjuro</h3>${Array.from({length:9},(_,i)=>i+1).map(l=>renderSlots(l,c.spellcasting.slots[l])).join('')}</div></div><div class="card"><div class="card-head"><h3>Trucos y conjuros preparados</h3><div class="spell-card-actions"><input class="spell-search" type="search" placeholder="Buscar conjuro…" value="${attr(spellSearch)}" oninput="spellSearch=this.value;renderSpellListOnly()" aria-label="Buscar conjuro"><button onclick="addSpell()">+ Añadir</button></div></div><div id="preparedSpellList" class="list">${renderPreparedSpellList(c)}</div></div></div>`}
function filteredPreparedSpells(c){const query=String(spellSearch||'').trim().toLocaleLowerCase('es');return c.spells.map((spell,index)=>({spell,index})).filter(({spell})=>!query||[spell.name,spell.casting,spell.range,spell.duration,spell.components,spell.notes,String(spell.level)].some(value=>String(value??'').toLocaleLowerCase('es').includes(query))).sort((a,b)=>{const aLevel=Number(a.spell.level)||0,bLevel=Number(b.spell.level)||0,aGroup=aLevel===0?0:(a.spell.prepared?1:2),bGroup=bLevel===0?0:(b.spell.prepared?1:2);return aGroup-bGroup||aLevel-bLevel||String(a.spell.name||'').localeCompare(String(b.spell.name||''),'es')})}
function renderPreparedSpellList(c){const filtered=filteredPreparedSpells(c);if(!c.spells.length)return '<div class="empty">No hay conjuros registrados.</div>';if(!filtered.length)return '<div class="empty">No hay conjuros que coincidan con la búsqueda.</div>';return filtered.map(({spell,index})=>renderSpell(spell,index)).join('')}
function renderSpellListOnly(){const list=document.getElementById('preparedSpellList');if(list)list.innerHTML=renderPreparedSpellList(ch())}function toggleSpellPrepared(i){const spell=ch().spells[i];if(!spell||Number(spell.level)<=0)return;spell.prepared=!spell.prepared;autoSave();renderSpellListOnly()}function updateSpellLevel(i,value){const spell=ch().spells[i];if(!spell)return;const level=Math.max(0,Math.min(9,Number(value)||0));spell.level=level;if(level===0)spell.prepared=false;autoSave();renderSpellListOnly()}
function renderNotes(c){return `<div class="card"><div class="notes-tabs">${[['historia','Historia'],['apariencia','Aspecto'],['personalidad','Personalidad'],['objetivos','Objetivos'],['sesiones','Sesiones'],['otros','Otros']].map(([k,l])=>`<button class="${activeNotes===k?'active':''}" onclick="activeNotes='${k}';render()">${l}</button>`).join('')}</div><textarea style="min-height:520px" onchange="set('notes.${activeNotes}',this.value)">${esc(c.notes[activeNotes])}</textarea></div>`}
function renderResource(r,i){const max=Math.max(0,Number.isFinite(Number(r.max))?Number(r.max):0),current=Math.max(0,Math.min(max,Number.isFinite(Number(r.current))?Number(r.current):0)),pct=max?Math.max(0,Math.min(100,current/max*100)):0;return `<div class="resource"><div class="resource-row"><div><label>Recurso</label><input value="${attr(r.name)}" onchange="updateList('resources',${i},'name',this.value)"></div><div><label>Actual</label><input type="number" min="0" max="${max}" value="${current}" onchange="setResourceCurrent(${i},this.value)"></div><div><label>Máx.</label><input type="number" min="0" value="${max}" onchange="setResourceMax(${i},this.value)"></div><button class="mini danger" onclick="removeList('resources',${i})">×</button></div><div class="resource-bar"><div style="width:${pct}%"></div></div><div class="small resource-rest" style="margin-top:6px"><span>Recupera en descanso</span> <button type="button" class="dot ${r.short?'active':''}" aria-label="Recupera en descanso corto" onclick="toggleResourceRest(${i},'short')"></button><span>corto</span><span>·</span><button type="button" class="dot ${r.long?'active':''}" aria-label="Recupera en descanso largo" onclick="toggleResourceRest(${i},'long')"></button><span>largo</span></div></div>`}
function renderTrainingSummary(items,type){if(!items.length)return '<div class="training-summary empty">Ninguna competencia seleccionada.</div>';return `<div class="training-summary">${items.map(x=>`<button type="button" class="training-chip" onclick="removeTrainingSelection('${type}','${x.replace(/'/g,"\\'")}')" title="Desmarcar ${x}"><span class="dot active"></span><span>${x}</span></button>`).join('')}</div>`}function renderTrainingCollapse(id,label,items,selected,type,category=''){const open=isTrainingGroupOpen(id),categoryActive=category&&weaponCategoryList().includes(category);return `<div class="training-collapse ${open?'open':''}"><div class="training-collapse-head">${category?`<button type="button" class="training-collapse-check" onclick="event.stopPropagation();toggleWeaponCategory('${category}')" title="${categoryActive?'Desmarcar':'Marcar'} competencia con armas ${category.toLowerCase()}" aria-label="${categoryActive?'Desmarcar':'Marcar'} competencia con armas ${category.toLowerCase()}"><span class="dot ${categoryActive?'active':''}"></span></button>`:''}<button type="button" class="training-collapse-toggle" onclick="toggleTrainingGroup('${id.replace(/'/g,"\\'")}')"><span class="training-subtitle">${label}</span><span class="training-collapse-arrow">${open?'▲':'▼'}</span></button></div><div class="training-collapse-body"><div class="${type==='tool'?'tool-list':type==='language'?'language-list':'weapon-list'}">${items.map(x=>`<div class="dot-option" role="button" tabindex="0" onclick="${type==='tool'?`toggleToolTraining('${x.replace(/'/g,"\\'")}')`:type==='language'?`toggleLanguageTraining('${x.replace(/'/g,"\\'")}')`:`toggleWeaponTraining('${x.replace(/'/g,"\\'")}')`}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${type==='tool'?`toggleToolTraining('${x.replace(/'/g,"\\'")}')`:type==='language'?`toggleLanguageTraining('${x.replace(/'/g,"\\'")}')`:`toggleWeaponTraining('${x.replace(/'/g,"\\'")}')`}}"><button type="button" class="dot ${selected.includes(x)?'active':''}" tabindex="-1" aria-label="${x}"></button><span>${x}</span></div>`).join('')}</div></div></div>`}function renderTrait(t,i){return `<div class="list-item ${t.open?'open':''}"><div class="list-head"><button class="ghost" style="text-align:left" onclick="updateList('traits',${i},'open',!ch().traits[${i}].open,true)"><strong>${esc(t.name||'Rasgo sin nombre')}</strong><div class="small">${esc(t.category||'Sin categoría')}</div></button><div class="list-actions"><button class="mini" onclick="moveListItem('traits',${i},-1)" ${i===0?'disabled':''} title="Subir rasgo">↑</button><button class="mini" onclick="moveListItem('traits',${i},1)" ${i===ch().traits.length-1?'disabled':''} title="Bajar rasgo">↓</button><button class="mini" onclick="updateList('traits',${i},'open',!ch().traits[${i}].open,true)">${t.open?'⌃':'⌄'}</button><button class="mini danger" onclick="removeList('traits',${i})">×</button></div></div><div class="collapsible-body"><div class="grid2"><div><label>Nombre</label><input value="${attr(t.name)}" onchange="updateList('traits',${i},'name',this.value,true)"></div><div><label>Categoría</label><select onchange="updateList('traits',${i},'category',this.value,true)">${['Clase','Especie','Dote','Trasfondo','Objeto','Otro'].map(x=>`<option ${t.category===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label style="margin-top:8px">Descripción</label><textarea onchange="updateList('traits',${i},'description',this.value)">${esc(t.description)}</textarea></div></div>`}
function renderSpell(s,i){const level=Math.max(0,Number(s.level)||0);return `<div class="list-item ${s.open?'open':''}"><div class="list-head spell-list-head ${level>0?'':'no-prepared'}">${level>0?`<div class="spell-prepared-wrap"><button type="button" class="spell-prepared-check ${s.prepared?'active':''}" onclick="event.stopPropagation();toggleSpellPrepared(${i})" title="${s.prepared?'Marcar como no preparado':'Marcar como preparado'}" aria-label="${s.prepared?'Marcar como no preparado':'Marcar como preparado'}"></button></div>`:''}<button class="ghost" style="text-align:left" onclick="updateList('spells',${i},'open',!ch().spells[${i}].open,true)"><strong>${esc(s.name||'Conjuro sin nombre')}</strong><div class="small">Nivel ${s.level} · ${esc(s.casting||'')}</div></button><div class="list-actions"><button class="mini" onclick="updateList('spells',${i},'open',!ch().spells[${i}].open,true)">${s.open?'⌃':'⌄'}</button><button class="mini danger" onclick="removeList('spells',${i})">×</button></div></div><div class="collapsible-body"><div class="grid3"><div><label>Nivel</label><input type="number" min="0" max="9" value="${s.level}" onchange="updateSpellLevel(${i},this.value)"></div><div><label>Nombre</label><input value="${attr(s.name)}" onchange="updateList('spells',${i},'name',this.value,true)"></div><div><label>Tiempo de lanzamiento</label><input value="${attr(s.casting)}" onchange="updateList('spells',${i},'casting',this.value)"></div><div><label>Alcance</label><input value="${attr(s.range)}" onchange="updateList('spells',${i},'range',this.value)"></div><div><label>Duración</label><input value="${attr(s.duration)}" onchange="updateList('spells',${i},'duration',this.value)"></div><div><label>Componentes</label><input value="${attr(s.components)}" onchange="updateList('spells',${i},'components',this.value)"></div></div><label style="margin-top:8px">Descripción y notas</label><textarea onchange="updateList('spells',${i},'notes',this.value)">${esc(s.notes)}</textarea></div></div>`}
function normalizeSlotUsage(s){const total=Math.max(0,Math.min(9,Number(s.total)||0));s.total=total;let spent;if(Number.isFinite(Number(s.spent))){spent=Math.max(0,Math.min(total,Number(s.spent)||0))}else if(Array.isArray(s.used)){spent=Math.max(0,Math.min(total,s.used.filter(Boolean).length))}else{spent=0}s.spent=spent;s.used=Array.from({length:total},(_,i)=>i>=total-spent);return s.used}
function renderSlots(level,s){const used=normalizeSlotUsage(s);return `<div class="spell-level"><h4>Nivel ${level}<span class="small"><input style="width:64px;display:inline-block" type="number" min="0" max="9" value="${s.total}" onchange="setSlotTotal(${level},this.value)"></span></h4><div class="slots">${Array.from({length:s.total},(_,i)=>`<button type="button" class="slot ${used[i]?'spent':''}" onclick="toggleSlot(${level},${i})" aria-label="Espacio de conjuro ${i+1}: ${used[i]?'usado':'disponible'}"><span></span></button>`).join('')||'<span class="small">Sin espacios</span>'}</div></div>`}

function cycleSkill(name){ch().skills[name].rank=(ch().skills[name].rank+1)%3;autoSave();render()}function toggleCondition(x){const a=ch().conditions,i=a.indexOf(x);i>=0?a.splice(i,1):a.push(x);autoSave();render()}function armorTrainingList(c=ch()){const value=c.training?.armor;if(Array.isArray(value))return value.filter(x=>['Ligeras','Medias','Pesadas','Escudos'].includes(x));const legacy=String(value||'').toLowerCase();return ['Ligeras','Medias','Pesadas','Escudos'].filter(x=>legacy.includes(x.toLowerCase()))}function toggleArmorTraining(name){if(!['Ligeras','Medias','Pesadas','Escudos'].includes(name))return;const c=ch(),list=armorTrainingList(c),i=list.indexOf(name);i>=0?list.splice(i,1):list.push(name);c.training.armor=list;autoSave();render()}function weaponCategoryList(c=ch()){const value=c.training?.weaponCategories;return Array.isArray(value)?value.filter(x=>WEAPON_CATEGORIES.includes(x)):[]}function weaponTrainingList(c=ch()){const value=c.training?.weapons;if(Array.isArray(value))return value.filter(x=>Object.values(WEAPONS_2024).flat().includes(x));const legacy=String(value||'').toLowerCase();return Object.values(WEAPONS_2024).flat().filter(x=>legacy.includes(x.toLowerCase()))}function toggleWeaponCategory(name){if(!WEAPON_CATEGORIES.includes(name))return;const c=ch(),list=weaponCategoryList(c),i=list.indexOf(name);i>=0?list.splice(i,1):list.push(name);c.training.weaponCategories=list;autoSave();render()}function toggleWeaponTraining(name){const all=Object.values(WEAPONS_2024).flat();if(!all.includes(name))return;const c=ch(),list=weaponTrainingList(c),i=list.indexOf(name);i>=0?list.splice(i,1):list.push(name);c.training.weapons=list;autoSave();render()}function ensureTrainingOpenGroups(c=ch()){if(!c.training)c.training={};if(!c.training.openGroups||typeof c.training.openGroups!=='object'||Array.isArray(c.training.openGroups))c.training.openGroups={};return c.training.openGroups}function isTrainingGroupOpen(id){return !!ensureTrainingOpenGroups()[id]}function toggleTrainingGroup(id){const groups=ensureTrainingOpenGroups();groups[id]=!groups[id];autoSave();render()}function removeTrainingSelection(type,name){if(type==='weapon'){if(WEAPON_CATEGORIES.includes(name))toggleWeaponCategory(name);else toggleWeaponTraining(name)}else if(type==='tool')toggleToolTraining(name);else if(type==='language')toggleLanguageTraining(name)}function toolTrainingList(c=ch()){const all=Object.values(TOOLS_2024).flat(),value=c.training?.tools;if(Array.isArray(value))return value.filter(x=>all.includes(x));const legacy=String(value||'').toLowerCase();return all.filter(x=>legacy.includes(x.toLowerCase()))}function toggleToolTraining(name){const all=Object.values(TOOLS_2024).flat();if(!all.includes(name))return;const c=ch(),list=toolTrainingList(c),i=list.indexOf(name);i>=0?list.splice(i,1):list.push(name);c.training.tools=list;autoSave();render()}function languageTrainingList(c=ch()){const all=Object.values(LANGUAGES_2024).flat(),value=c.training?.languages;if(Array.isArray(value))return value.filter(x=>all.includes(x));const legacy=String(value||'').toLowerCase();return all.filter(x=>legacy.includes(x.toLowerCase()))}function toggleLanguageTraining(name){const all=Object.values(LANGUAGES_2024).flat();if(!all.includes(name))return;const c=ch(),list=languageTrainingList(c),i=list.indexOf(name);i>=0?list.splice(i,1):list.push(name);c.training.languages=list;autoSave();render()}function setResourceCurrent(i,value){const r=ch().resources[i];if(!r)return;const max=Math.max(0,Number.isFinite(Number(r.max))?Number(r.max):0),n=Number(value);r.max=max;r.current=Math.max(0,Math.min(max,Number.isFinite(n)?n:0));autoSave();render()}function setResourceMax(i,value){const r=ch().resources[i];if(!r)return;const n=Number(value);r.max=Math.max(0,Number.isFinite(n)?n:0);r.current=Math.max(0,Math.min(r.max,Number.isFinite(Number(r.current))?Number(r.current):0));autoSave();render()}function toggleResourceRest(i,key){const r=ch().resources[i];if(!r||!['short','long'].includes(key))return;const wasActive=!!r[key];r.short=false;r.long=false;if(!wasActive)r[key]=true;autoSave();render()}function setCurrentHP(value){const c=ch(),n=Number(value);c.hp.current=Math.max(-c.hp.max,Math.min(c.hp.max,Number.isFinite(n)?n:0));autoSave();render()}function setMaxHP(value){const c=ch(),n=Number(value);c.hp.max=Math.max(1,Math.min(999,Number.isFinite(n)?n:1));c.hp.current=Math.max(-c.hp.max,Math.min(c.hp.max,c.hp.current));c.hp.temp=Math.max(0,c.hp.temp);autoSave();render()}function setTempHP(value){const c=ch(),n=Number(value);c.hp.temp=Math.max(0,Number.isFinite(n)?n:0);autoSave();render()}function adjustHP(direction){const input=document.getElementById('hpAdjustment'),raw=Number(input?.value),amount=Math.max(0,Number.isFinite(raw)?raw:0),c=ch();if(direction<0){const absorbed=Math.min(c.hp.temp,amount);c.hp.temp=Math.max(0,c.hp.temp-absorbed);const remaining=amount-absorbed;if(remaining>0)c.hp.current=Math.max(-c.hp.max,c.hp.current-remaining)}else if(direction>0){c.hp.current=Math.min(c.hp.max,c.hp.current+amount)}autoSave();render()}function restoreHP(){const c=ch();c.hp.current=c.hp.max;c.hp.temp=0;autoSave();render()}function setCurrentHitDice(value){const c=ch(),n=Number(value);c.hitDice.current=Math.max(1,Math.min(c.hitDice.max,Number.isFinite(n)?n:1));autoSave();render()}function setMaxHitDice(value){const c=ch(),n=Number(value);c.hitDice.max=Math.max(1,Math.min(20,Number.isFinite(n)?n:1));c.hitDice.current=Math.max(1,Math.min(c.hitDice.max,c.hitDice.current));autoSave();render()}function setDeathSave(type,value){const c=ch(),current=Number(c.death[type])||0;c.death[type]=current===value?value-1:value;autoSave();render()}function updateList(list,i,key,value,rerender=false){ch()[list][i][key]=value;autoSave();if(rerender)render()}function removeList(list,i){ch()[list].splice(i,1);autoSave();render()}function moveListItem(list,i,direction){const items=ch()[list],target=i+direction;if(!Array.isArray(items)||target<0||target>=items.length)return;[items[i],items[target]]=[items[target],items[i]];autoSave();render()}function toggleWeaponPicker(){weaponPickerOpen=!weaponPickerOpen;render()}function weaponIsProficient(name,data,c=ch()){return weaponCategoryList(c).includes(data.category)||weaponTrainingList(c).includes(name)}function weaponAbilityMod(data,c=ch()){const str=mod(c.abilities.str.score),dex=mod(c.abilities.dex.score);if(data.finesse)return Math.max(str,dex);return data.kind==='ranged'?dex:str}function weaponAttackValue(name,data,c=ch()){return signed(weaponAbilityMod(data,c)+(weaponIsProficient(name,data,c)?prof():0))}function weaponDamageValue(data,c=ch()){const bonus=weaponAbilityMod(data,c),suffix=bonus===0?'':bonus>0?` + ${bonus}`:` - ${Math.abs(bonus)}`;return `${data.damage}${suffix} ${data.type}`}function weaponNotesValue(data){const parts=[];if(data.properties&&data.properties.length)parts.push(data.properties.join(', '));if(data.mastery)parts.push(`Maestría: ${data.mastery}`);return parts.join(' · ')}function syncAutoWeapons(c=ch()){if(!Array.isArray(c.weapons))c.weapons=[];c.weapons.forEach(w=>{if(!w||w.source!=='weapon2024'||!w.weaponId||!WEAPON_DATA_2024[w.weaponId])return;const data=WEAPON_DATA_2024[w.weaponId];w.name=w.weaponId;w.attack=weaponAttackValue(w.weaponId,data,c);w.damage=weaponDamageValue(data,c);w.range=data.range;w.notes=weaponNotesValue(data)})}function addWeaponFromCatalog(name){const data=WEAPON_DATA_2024[name];if(!data)return;ch().weapons.push({source:'weapon2024',weaponId:name,name,attack:weaponAttackValue(name,data),damage:weaponDamageValue(data),range:data.range,notes:weaponNotesValue(data)});weaponPickerOpen=false;autoSave();render()}function updateWeaponField(i,key,value){const w=ch().weapons[i];if(!w)return;w[key]=value;if(w.source==='weapon2024')w.source='manual';autoSave()}function moveWeapon(i,direction){const list=ch().weapons,target=i+direction;if(target<0||target>=list.length)return;[list[i],list[target]]=[list[target],list[i]];autoSave();render()}function addWeapon(){ch().weapons.push({source:'manual',name:'',attack:'',damage:'',range:'',notes:''});autoSave();render()}function addTrait(){ch().traits.push({name:'Nuevo rasgo',category:'Clase',description:'',open:true});autoSave();render()}function addResource(){ch().resources.push({name:'Nuevo recurso',current:1,max:1,short:false,long:true});autoSave();render()}function addItem(){ch().inventory.push({name:'Nuevo objeto',category:'Equipo',qty:1,weight:0,equipped:false,notes:''});autoSave();render()}function addSpell(){ch().spells.push({level:0,name:'Nuevo conjuro',casting:'',range:'',duration:'',components:'',notes:'',open:true});autoSave();render()}function setSlotTotal(level,value){const s=ch().spellcasting.slots[level],n=Number(value);s.total=Math.max(0,Math.min(9,Number.isFinite(n)?n:0));normalizeSlotUsage(s);autoSave();render()}function toggleSlot(level,i){const s=ch().spellcasting.slots[level],used=normalizeSlotUsage(s),total=s.total;if(i<0||i>=total)return;const firstSpent=total-s.spent;if(i<firstSpent){s.spent=total-i}else{s.spent=total-i-1}normalizeSlotUsage(s);autoSave();render()}
function openCombatManager(){
  const overlay=document.getElementById('combatModal');
  const button=document.getElementById('combatFab');
  overlay.classList.add('open');
  document.body.classList.add('combat-panel-open');
  button.textContent='✕';
  button.title='Cerrar gestor de combate';
  button.setAttribute('aria-label','Cerrar gestor de combate');
  button.setAttribute('aria-expanded','true');
  const c=ch(),body=document.getElementById('combatManagerBody');body.innerHTML=`<div class="combat-modal-grid"><div><label>PG actuales</label><input type="number" min="${-c.hp.max}" max="${c.hp.max}" value="${c.hp.current}" onchange="setCurrentHP(this.value);openCombatManager()"></div><div><label>PG máximos</label><input type="number" min="1" max="999" value="${c.hp.max}" onchange="setMaxHP(this.value);openCombatManager()"></div><div><label>PG temporales</label><input type="number" min="0" value="${c.hp.temp}" onchange="setTempHP(this.value);openCombatManager()"></div></div><div class="combat-modal-section"><label for="hpAdjustment">Cantidad de daño o curación</label><input id="hpAdjustment" type="number" min="0" step="1" value="1" onkeydown="if(event.key==='Enter') adjustHPFromModal(-1)"><div class="combat-modal-actions"><button onclick="adjustHPFromModal(-1)">− Restar PG</button><button onclick="adjustHPFromModal(1)">+ Sumar PG</button><button onclick="restoreHPFromModal()">Restaurar</button></div></div><div class="combat-modal-section"><h4>Dados de golpe</h4><div class="combat-modal-grid"><div><label>Dado</label><input value="${attr(c.hitDice.die)}" onchange="set('hitDice.die',this.value,true);openCombatManager()"></div><div><label>Actuales</label><input type="number" min="1" max="${c.hitDice.max}" value="${c.hitDice.current}" onchange="setCurrentHitDice(this.value);openCombatManager()"></div><div><label>Máximos</label><input type="number" min="1" max="20" value="${c.hitDice.max}" onchange="setMaxHitDice(this.value);openCombatManager()"></div></div></div><div class="combat-modal-section"><div class="combat-modal-actions"><button onclick="closeCombatManager();openRest('short')">Descanso corto</button><button onclick="closeCombatManager();openRest('long')">Descanso largo</button><button onclick="closeCombatManager()">Cerrar</button></div></div>`;document.getElementById('combatModal').classList.add('open')}function updateCombatButtonPosition(){
  const header=document.querySelector('header');
  let buttonTop=14;

  if(header){
    const style=getComputedStyle(header);
    const rect=header.getBoundingClientRect();
    const isVisible=style.display!=='none' && style.visibility!=='hidden' && rect.height>0;

    if(isVisible){
      buttonTop=Math.max(14,Math.ceil(rect.bottom)+12);
    }
  }

  document.documentElement.style.setProperty('--floating-nav-button-top',`${buttonTop}px`);

let combatOverlayShouldClose=false;

function initCombatOverlay(){
  const overlay=document.getElementById('combatModal');
  const panel=overlay?.querySelector('.combat-side-panel');

  if(!overlay||!panel||overlay.dataset.outsideCloseReady==='true')return;

  overlay.dataset.outsideCloseReady='true';

  overlay.addEventListener('pointerdown',event=>{
    combatOverlayShouldClose=!panel.contains(event.target);
  });

  overlay.addEventListener('pointercancel',()=>{
    combatOverlayShouldClose=false;
  });

  overlay.addEventListener('click',event=>{
    if(combatOverlayShouldClose&&event.target===overlay){
      closeCombatManager();
    }
    combatOverlayShouldClose=false;
  });
}

function toggleCombatManager(){
  const overlay=document.getElementById('combatModal');
  overlay.classList.contains('open')?closeCombatManager():openCombatManager();
}
function closeCombatManager(){
  const overlay=document.getElementById('combatModal');
  const button=document.getElementById('combatFab');
  overlay.classList.remove('open');
  document.body.classList.remove('combat-panel-open');
  button.textContent='♥';
  button.title='Abrir gestor de combate';
  button.setAttribute('aria-label','Abrir gestor de combate');
  button.setAttribute('aria-expanded','false');
}
function adjustHPFromModal(direction){adjustHP(direction);openCombatManager()}function restoreHPFromModal(){restoreHP();openCombatManager()}
function openRest(type){restType=type;document.getElementById('restTitle').textContent=type==='short'?'Descanso corto':'Descanso largo';const c=ch(),eligible=c.resources.map((r,i)=>({r,i})).filter(x=>type==='short'?x.r.short:(x.r.long||x.r.short));document.getElementById('restOptions').innerHTML=`<label><input class="check" id="restDeath" type="checkbox" ${type==='long'?'checked':''}> Reiniciar salvaciones contra muerte</label>${type==='long'?'<label><input class="check" id="restHp" type="checkbox" checked> Recuperar todos los puntos de golpe</label><label><input class="check" id="restHit" type="checkbox" checked> Recuperar la mitad de los dados de golpe máximos</label>':'<label><input class="check" id="restHp" type="checkbox"> Ajustar manualmente los PG después del descanso</label>'}<label><input class="check" id="restSlots" type="checkbox" ${type==='long'?'checked':''}> Recuperar espacios de conjuro</label><h4 style="margin-top:14px">Recursos</h4>${eligible.length?eligible.map(x=>`<label><input class="check rest-resource" type="checkbox" value="${x.i}" checked> Recuperar ${esc(x.r.name)}</label>`).join(''):'<div class="empty">No hay recursos configurados para este descanso.</div>'}`;document.getElementById('restModal').classList.add('open')}
function closeRest(){document.getElementById('restModal').classList.remove('open')}function applyRest(){const c=ch();if(document.getElementById('restDeath')?.checked)c.death={success:0,fail:0};if(restType==='long'){if(document.getElementById('restHp')?.checked){c.hp.current=c.hp.max;c.hp.temp=0}if(document.getElementById('restHit')?.checked)c.hitDice.current=Math.min(c.hitDice.max,c.hitDice.current+Math.max(1,Math.floor(c.hitDice.max/2)))}if(document.getElementById('restSlots')?.checked){Object.values(c.spellcasting.slots).forEach(s=>{s.spent=0;s.used=Array.from({length:Math.max(0,Number(s.total)||0)},()=>false)})}document.querySelectorAll('.rest-resource:checked').forEach(el=>{const r=c.resources[Number(el.value)];if(r)r.current=r.max});autoSave();closeRest();render()}
function exportState(){state.characters.forEach(syncAutoWeapons);const characterName=String(ch()?.name||'Personaje').trim()||'Personaje',safeName=characterName.replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim(),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Ficha-${safeName}.json`;a.click();URL.revokeObjectURL(a.href)}document.getElementById('importInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.characters)||!data.characters.length)throw new Error();const existingIds=new Set(state.characters.map(character=>character.id)),importedCharacters=data.characters.map(character=>{const imported=structuredClone(character);if(!imported.id||existingIds.has(imported.id)){do{imported.id=uid()}while(existingIds.has(imported.id))}existingIds.add(imported.id);return imported});state.characters.push(...importedCharacters);state.activeId=importedCharacters[0].id;autoSave();render();const count=importedCharacters.length;alert(`${count} personaje${count===1?' importado':'s importados'} correctamente.`)}catch(err){alert('El archivo JSON no es válido.')}};r.readAsText(f);e.target.value=''})
render();

  updateCombatButtonPosition();
  initCombatOverlay();

window.addEventListener('scroll',updateCombatButtonPosition,{passive:true});
